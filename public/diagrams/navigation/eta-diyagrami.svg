<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .lbl{font:13px sans-serif;fill:#0f172a;font-weight:600}
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .sub{font:12px sans-serif;fill:#475569}
      .frm{font:15px sans-serif;fill:#0f172a;font-weight:700;text-anchor:middle}
    </style>
    <marker id="tarr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1e3a8a"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#ffffff"/>
  <text x="350" y="34" text-anchor="middle" class="ttl">ETA (Tahmini Varış Zamanı) Diyagramı</text>

  <!-- timeline -->
  <line x1="80" y1="150" x2="630" y2="150" stroke="#1e3a8a" stroke-width="3" marker-end="url(#tarr)"/>

  <!-- departure node -->
  <circle cx="110" cy="150" r="10" fill="#16a34a" stroke="#0f172a" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" class="lbl">Kalkış</text>
  <text x="110" y="185" text-anchor="middle" class="sub">ETD 0600</text>

  <!-- waypoint -->
  <circle cx="370" cy="150" r="8" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
  <text x="370" y="120" text-anchor="middle" class="lbl">Waypoint</text>
  <text x="370" y="185" text-anchor="middle" class="sub">1015</text>

  <!-- arrival node -->
  <circle cx="600" cy="150" r="10" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" class="lbl">Varış</text>
  <text x="600" y="185" text-anchor="middle" class="sub">ETA 1430</text>

  <!-- distance brackets -->
  <text x="240" y="225" text-anchor="middle" class="sub">120 NM · 14 kn</text>
  <text x="485" y="225" text-anchor="middle" class="sub">100 NM · 14 kn</text>

  <!-- formula box -->
  <g transform="translate(160 270)">
    <rect x="0" y="0" width="380" height="100" rx="10" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="190" y="34" class="frm">Zaman = Mesafe ÷ Hız</text>
    <text x="190" y="62" class="sub" text-anchor="middle">Seyir süresi = 220 NM ÷ 14 kn ≈ 15 sa 43 dk</text>
    <text x="190" y="84" class="sub" text-anchor="middle">ETA = ETD + Seyir süresi (+ duraklamalar)</text>
  </g>
</svg>
