<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .lbl{font:13px sans-serif;fill:#0f172a;font-weight:600}
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .sub{font:12px sans-serif;fill:#475569}
      .course{stroke:#1d4ed8;stroke-width:3;fill:none}
      .ep{stroke:#dc2626;stroke-width:2.5;fill:none;stroke-dasharray:6,5}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#ffffff"/>
  <text x="350" y="32" text-anchor="middle" class="ttl">Dead Reckoning Diagram</text>

  <!-- sea grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="90" x2="40" y2="420"/>
    <line x1="180" y1="90" x2="180" y2="420"/>
    <line x1="320" y1="90" x2="320" y2="420"/>
    <line x1="460" y1="90" x2="460" y2="420"/>
    <line x1="600" y1="90" x2="600" y2="420"/>
    <line x1="40" y1="120" x2="660" y2="120"/>
    <line x1="40" y1="240" x2="660" y2="240"/>
    <line x1="40" y1="360" x2="660" y2="360"/>
  </g>

  <!-- North arrow -->
  <g transform="translate(80 130)">
    <line x1="0" y1="30" x2="0" y2="-10" stroke="#0f172a" stroke-width="2"/>
    <path d="M0,-14 L5,-2 L-5,-2 Z" fill="#0f172a"/>
    <text x="0" y="48" text-anchor="middle" class="lbl">N</text>
  </g>

  <!-- Course line -->
  <line x1="120" y1="380" x2="560" y2="140" class="course" marker-end="url(#arr)"/>

  <!-- Fix (known start position) -->
  <circle cx="120" cy="380" r="9" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="120" cy="380" r="2.5" fill="#16a34a"/>
  <text x="120" y="410" text-anchor="middle" class="lbl">Fix · 0800</text>

  <!-- DR positions (semicircle marks along course) -->
  <g fill="#1d4ed8">
    <path d="M 265 300 a 7 7 0 0 1 14 0 z" transform="rotate(-29 272 300)"/>
    <path d="M 412 219 a 7 7 0 0 1 14 0 z" transform="rotate(-29 419 219)"/>
  </g>
  <text x="280" y="335" text-anchor="middle" class="sub">DR 0900</text>
  <text x="430" y="252" text-anchor="middle" class="sub">DR 1000</text>

  <!-- EP (estimated position with set/drift) -->
  <line x1="560" y1="140" x2="600" y2="175" class="ep"/>
  <path d="M 590 155 a 9 9 0 0 1 0 18" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="600" y="195" text-anchor="middle" class="lbl" fill="#dc2626">EP</text>

  <!-- labels -->
  <text x="330" y="245" text-anchor="middle" class="lbl" fill="#1d4ed8" transform="rotate(-29 330 245)">Course (steady) · Distance = Speed × Time</text>

  <!-- legend -->
  <g transform="translate(420 405)">
    <circle cx="0" cy="-4" r="7" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="14" y="0" class="sub">Fix (true position)</text>
    <path d="M 150 -8 a 6 6 0 0 1 12 0 z" fill="#1d4ed8"/>
    <text x="170" y="0" class="sub">DR position</text>
  </g>
</svg>
