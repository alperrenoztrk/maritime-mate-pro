<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .lbl{font:13px sans-serif;fill:#0f172a;font-weight:600}
      .sm{font:11px sans-serif;fill:#334155}
      .c{fill-opacity:0.55}
    </style>
  </defs>
  <rect width="700" height="460" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" class="ttl">Köprüüstü Kaynak Yönetimi (BRM) — Temel Bileşenler</text>

  <!-- three overlapping circles -->
  <circle cx="280" cy="170" r="105" fill="#dbeafe" stroke="#1e3a8a" class="c"/>
  <circle cx="420" cy="170" r="105" fill="#dcfce7" stroke="#16a34a" class="c"/>
  <circle cx="350" cy="280" r="105" fill="#fef3c7" stroke="#b45309" class="c"/>

  <text x="245" y="140" text-anchor="middle" class="lbl" fill="#1e3a8a">Liderlik</text>
  <text x="245" y="156" text-anchor="middle" class="sm">Rol ve sorumluluk</text>
  <text x="245" y="170" text-anchor="middle" class="sm">dağılımı, otorite</text>
  <text x="245" y="184" text-anchor="middle" class="sm">gradyanı dengesi</text>

  <text x="462" y="140" text-anchor="middle" class="lbl" fill="#15803d">İletişim</text>
  <text x="462" y="156" text-anchor="middle" class="sm">Kapalı devre iletişim,</text>
  <text x="462" y="170" text-anchor="middle" class="sm">brifing, meydan</text>
  <text x="462" y="184" text-anchor="middle" class="sm">okuma (challenge)</text>

  <text x="350" y="322" text-anchor="middle" class="lbl" fill="#b45309">Durumsal Farkındalık</text>
  <text x="350" y="338" text-anchor="middle" class="sm">İzleme, çapraz kontrol,</text>
  <text x="350" y="352" text-anchor="middle" class="sm">iş yükü ve yorgunluk yönetimi</text>

  <text x="350" y="212" text-anchor="middle" class="lbl">Emniyetli</text>
  <text x="350" y="228" text-anchor="middle" class="lbl">Seyir</text>

  <!-- info box -->
  <rect x="60" y="400" width="580" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="418" class="sm">BRM; köprüüstündeki insan, bilgi ve donanım kaynaklarının tek hedefe — emniyetli seyre —</text>
  <text x="75" y="434" class="sm">yönlendirilmesidir: tek kişilik hataların zinciri kırılır, ekip olarak karar verilir.</text>
</svg>
