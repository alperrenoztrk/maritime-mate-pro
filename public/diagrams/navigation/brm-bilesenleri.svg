<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .lbl{font:13px sans-serif;fill:#0f172a;font-weight:600}
      .sm{font:11px sans-serif;fill:#334155}
      .c{fill-opacity:0.55}
    </style>
  </defs>
  <rect width="700" height="460" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" class="ttl">Bridge Resource Management (BRM) — Core Elements</text>

  <!-- three overlapping circles -->
  <circle cx="280" cy="170" r="105" fill="#dbeafe" stroke="#1e3a8a" class="c"/>
  <circle cx="420" cy="170" r="105" fill="#dcfce7" stroke="#16a34a" class="c"/>
  <circle cx="350" cy="280" r="105" fill="#fef3c7" stroke="#b45309" class="c"/>

  <text x="245" y="140" text-anchor="middle" class="lbl" fill="#1e3a8a">Leadership</text>
  <text x="245" y="156" text-anchor="middle" class="sm">Distribution of roles</text>
  <text x="245" y="170" text-anchor="middle" class="sm">and responsibility,</text>
  <text x="245" y="184" text-anchor="middle" class="sm">balanced authority gradient</text>

  <text x="462" y="140" text-anchor="middle" class="lbl" fill="#15803d">Communication</text>
  <text x="462" y="156" text-anchor="middle" class="sm">Closed-loop communication,</text>
  <text x="462" y="170" text-anchor="middle" class="sm">briefing, challenge</text>
  <text x="462" y="184" text-anchor="middle" class="sm">and response</text>

  <text x="350" y="322" text-anchor="middle" class="lbl" fill="#b45309">Situational Awareness</text>
  <text x="350" y="338" text-anchor="middle" class="sm">Monitoring, cross-checking,</text>
  <text x="350" y="352" text-anchor="middle" class="sm">workload and fatigue management</text>

  <text x="350" y="212" text-anchor="middle" class="lbl">Safe</text>
  <text x="350" y="228" text-anchor="middle" class="lbl">Navigation</text>

  <!-- info box -->
  <rect x="60" y="400" width="580" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="418" class="sm">BRM directs the human, information and equipment resources of the bridge towards one aim —</text>
  <text x="75" y="434" class="sm">safe navigation: the chain of single-person error is broken and decisions are made as a team.</text>
</svg>
