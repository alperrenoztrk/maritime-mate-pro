<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .lbl{font:12px sans-serif;fill:#0f172a;font-weight:600}
      .sm{font:11px sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="700" height="460" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" class="ttl">Look-out and Safe Speed — COLREG Rules 5 and 6</text>

  <!-- sea background -->
  <rect x="40" y="50" width="330" height="290" fill="#e0f2fe" stroke="#94a3b8"/>

  <!-- lookout sectors around own ship -->
  <g>
    <circle cx="205" cy="195" r="120" fill="#eff6ff" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <circle cx="205" cy="195" r="75" fill="#dbeafe" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <!-- own ship pointing up -->
    <path fill="#1e3a8a" d="M 205 145 L 193 170 L 193 240 L 217 240 L 217 170 Z"/>
    <text x="205" y="90" text-anchor="middle" class="sm">Sight (visual)</text>
    <text x="205" y="270" text-anchor="middle" class="sm">Hearing + radar/AIS/VHF</text>
    <text x="205" y="325" text-anchor="middle" class="lbl">Rule 5: a proper look-out at all times</text>
  </g>
  <text x="205" y="343" text-anchor="middle" class="sm">by all available means</text>

  <!-- safe speed factors -->
  <rect x="400" y="50" width="260" height="290" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="78" text-anchor="middle" class="lbl">Rule 6: factors in safe speed</text>
  <g class="sm">
    <text x="418" y="108">• State of visibility (fog, precipitation)</text>
    <text x="418" y="134">• Traffic density</text>
    <text x="418" y="160">• Manoeuvrability and stopping distance</text>
    <text x="418" y="186">• At night — shore lights and back scatter</text>
    <text x="418" y="212">• State of wind, sea and current</text>
    <text x="418" y="238">• Depth of water relative to draft</text>
    <text x="418" y="264">• Limitations of the radar equipment</text>
  </g>
  <text x="530" y="322" text-anchor="middle" class="sm" fill="#b45309">The ship must proceed at a speed allowing</text>
  <text x="530" y="337" text-anchor="middle" class="sm" fill="#b45309">proper and effective action to avoid collision</text>

  <!-- info box -->
  <rect x="60" y="355" width="580" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="377" class="lbl">Summary:</text>
  <text x="75" y="395" class="sm">Rule 5 — Every vessel shall maintain a proper look-out by sight and hearing and by all available</text>
  <text x="75" y="411" class="sm">means to appraise the situation. Rule 6 — Every vessel shall at all times proceed at a safe speed.</text>
</svg>
