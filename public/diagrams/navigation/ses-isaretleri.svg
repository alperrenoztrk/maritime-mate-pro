<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:14px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:10.5px sans-serif;fill:#475569}
      .blast{fill:#1e3a8a}
    </style>
  </defs>
  <rect width="720" height="500" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">COLREG Ses İşaretleri (Kural 32-35)</text>
  <text x="360" y="46" text-anchor="middle" class="sm">● kısa düdük ≈ 1 sn · ▬ uzun düdük 4-6 sn</text>

  <!-- left panel: Rule 34 in sight -->
  <g transform="translate(20 60)">
    <rect width="330" height="420" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="16" y="30" class="hd" fill="#1d4ed8">Görüş içinde (Kural 34)</text>

    <circle cx="22" cy="60" r="6" class="blast"/>
    <text x="40" y="64" class="it">Sancağa dönüyorum</text>

    <circle cx="22" cy="100" r="6" class="blast"/><circle cx="42" cy="100" r="6" class="blast"/>
    <text x="60" y="104" class="it">İskeleye dönüyorum</text>

    <circle cx="22" cy="140" r="6" class="blast"/><circle cx="42" cy="140" r="6" class="blast"/><circle cx="62" cy="140" r="6" class="blast"/>
    <text x="80" y="144" class="it">Tornistan (geri) çalışıyorum</text>

    <circle cx="22" cy="180" r="6" class="blast"/><circle cx="40" cy="180" r="6" class="blast"/><circle cx="58" cy="180" r="6" class="blast"/><circle cx="76" cy="180" r="6" class="blast"/><circle cx="94" cy="180" r="6" class="blast"/>
    <text x="112" y="184" class="it">Şüphe / ikaz (≥5 kısa, hızlı)</text>

    <rect x="16" y="214" width="34" height="12" rx="6" class="blast"/>
    <text x="58" y="224" class="it">Görüşü kapalı dönemeç (1 uzun)</text>

    <line x1="16" y1="248" x2="314" y2="248" stroke="#bfdbfe"/>
    <text x="16" y="272" class="hd" fill="#1d4ed8" font-size="13">Dar kanalda geçme (Kural 34c)</text>
    <rect x="16" y="288" width="34" height="12" rx="6" class="blast"/><rect x="56" y="288" width="34" height="12" rx="6" class="blast"/><circle cx="104" cy="294" r="6" class="blast"/>
    <text x="16" y="320" class="sm">Sancaktan geçeceğim: ▬ ▬ ●</text>
    <rect x="16" y="334" width="34" height="12" rx="6" class="blast"/><rect x="56" y="334" width="34" height="12" rx="6" class="blast"/><circle cx="104" cy="340" r="6" class="blast"/><circle cx="122" cy="340" r="6" class="blast"/>
    <text x="16" y="366" class="sm">İskeleden geçeceğim: ▬ ▬ ● ●</text>
    <text x="16" y="392" class="sm">Onay (geçilen gemi): ▬ ● ▬ ●  (Morse "C")</text>
  </g>

  <!-- right panel: Rule 35 restricted visibility -->
  <g transform="translate(370 60)">
    <rect width="330" height="420" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="16" y="30" class="hd" fill="#a16207">Kısıtlı görüşte (Kural 35) — ≤ 2 dk arayla</text>

    <rect x="16" y="52" width="34" height="12" rx="6" class="blast"/>
    <text x="58" y="62" class="it">Yolda motorlu gemi (1 uzun)</text>

    <rect x="16" y="92" width="34" height="12" rx="6" class="blast"/><rect x="56" y="92" width="34" height="12" rx="6" class="blast"/>
    <text x="98" y="102" class="it">Durmuş, yol yok (2 uzun)</text>

    <rect x="16" y="132" width="34" height="12" rx="6" class="blast"/><circle cx="62" cy="138" r="6" class="blast"/><circle cx="80" cy="138" r="6" class="blast"/>
    <text x="16" y="166" class="it">NUC/RAM/CBD/yelken/balıkçı/çeken:</text>
    <text x="16" y="184" class="sm">1 uzun + 2 kısa (▬ ● ●)</text>

    <rect x="16" y="200" width="34" height="12" rx="6" class="blast"/><circle cx="62" cy="206" r="6" class="blast"/><circle cx="80" cy="206" r="6" class="blast"/><circle cx="98" cy="206" r="6" class="blast"/>
    <text x="16" y="234" class="it">Çekilen (manlı) gemi: 1 uzun + 3 kısa</text>

    <line x1="16" y1="256" x2="314" y2="256" stroke="#fde68a"/>
    <text x="16" y="282" class="it">Demirde: hızlı çan ~5 sn (≤ 1 dk arayla)</text>
    <text x="16" y="306" class="sm">≥ 100 m: önde çan + kıçta gong</text>
    <text x="16" y="330" class="it">Karaya oturmuş: çan + önce/sonra 3 ayrı vuruş</text>
    <text x="16" y="360" class="sm">&lt; 12 m: zorunlu değil, ama ≤ 2 dk'da</text>
    <text x="16" y="378" class="sm">başka etkili bir ses işareti verilmeli</text>
    <text x="16" y="404" class="sm">Cihaz (Kural 33): düdük; ≥ 20 m çan; ≥ 100 m gong</text>
  </g>
</svg>
