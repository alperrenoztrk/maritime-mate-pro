<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .lbl{font:12px sans-serif;fill:#0f172a;font-weight:600}
      .sm{font:11px sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="700" height="460" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" class="ttl">Overtaking — COLREG Rule 13</text>

  <!-- sea background -->
  <rect x="40" y="50" width="620" height="290" fill="#e0f2fe" stroke="#94a3b8"/>

  <!-- Overtaken vessel: centre, heading east -->
  <g>
    <path fill="#16a34a" d="M 430 195 L 405 183 L 305 183 L 305 207 L 405 207 Z"/>
    <line x1="440" y1="195" x2="500" y2="195" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5"/>
    <path fill="#16a34a" d="M 488 188 L 500 195 L 488 202 Z"/>
    <text x="368" y="172" text-anchor="middle" class="lbl" fill="#15803d">Vessel being overtaken (keeps course and speed)</text>
  </g>

  <!-- 22.5° abaft the beam sector lines from overtaken vessel -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="368" y1="195" x2="150" y2="90"/>
    <line x1="368" y1="195" x2="150" y2="300"/>
  </g>
  <text x="130" y="195" text-anchor="middle" class="sm" fill="#b45309">Sternlight sector</text>
  <text x="130" y="210" text-anchor="middle" class="sm" fill="#b45309">(135° = more than 22.5°</text>
  <text x="130" y="225" text-anchor="middle" class="sm" fill="#b45309">abaft the beam)</text>

  <!-- Overtaking vessel: behind, on the quarter, heading east -->
  <g>
    <path fill="#dc2626" d="M 230 275 L 205 263 L 105 263 L 105 287 L 205 287 Z"/>
    <text x="160" y="312" text-anchor="middle" class="lbl" fill="#dc2626">Overtaking vessel (gives way)</text>
    <!-- overtaking track: pass clear on either side -->
    <path d="M 240 275 Q 340 268 420 245 Q 530 215 600 175" stroke="#b45309" stroke-width="2.5" fill="none"/>
    <path fill="#b45309" d="M 588 184 L 600 175 L 594 189 Z"/>
    <text x="480" y="265" text-anchor="middle" class="sm" fill="#b45309">Keeps clear of the overtaken vessel</text>
    <text x="480" y="280" text-anchor="middle" class="sm" fill="#b45309">until finally past and clear</text>
  </g>

  <!-- info box -->
  <rect x="60" y="355" width="580" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="377" class="lbl">Rule 13:</text>
  <text x="75" y="395" class="sm">A vessel coming up with another from more than 22.5° abaft her beam (at night seeing only her</text>
  <text x="75" y="411" class="sm">sternlight) is the OVERTAKING vessel and shall keep out of the way until finally past and clear.</text>
</svg>
