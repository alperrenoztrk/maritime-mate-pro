<svg width="720" height="450" viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:13px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:11px sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="720" height="450" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">Marine Insurance and General Average</text>

  <!-- who covers what -->
  <g transform="translate(20 44)">
    <rect width="680" height="164" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="28" class="hd">Three separate covers — they do not overlap</text>

    <g transform="translate(18 44)">
      <rect width="206" height="104" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="26" class="it" style="fill:#1d4ed8">Hull &amp; Machinery</text>
      <text x="14" y="48" class="sm">Damage to the ship herself.</text>
      <text x="14" y="66" class="sm">Placed with an underwriter</text>
      <text x="14" y="82" class="sm">on an agreed value.</text>
    </g>

    <g transform="translate(238 44)">
      <rect width="206" height="104" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="26" class="it" style="fill:#15803d">P&amp;I Club</text>
      <text x="14" y="48" class="sm">Third-party liabilities: crew,</text>
      <text x="14" y="66" class="sm">cargo claims, pollution,</text>
      <text x="14" y="82" class="sm">wreck removal, collision.</text>
    </g>

    <g transform="translate(458 44)">
      <rect width="206" height="104" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text x="14" y="26" class="it" style="fill:#b45309">Cargo insurance</text>
      <text x="14" y="48" class="sm">Taken out by the cargo</text>
      <text x="14" y="66" class="sm">owner, not the ship.</text>
      <text x="14" y="82" class="sm">Institute Cargo Clauses.</text>
    </g>
  </g>

  <!-- general average -->
  <g transform="translate(20 222)">
    <rect width="680" height="208" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="18" y="28" class="hd" style="fill:#b91c1c">General Average — York-Antwerp Rules</text>

    <text x="18" y="56" class="it">The principle</text>
    <text x="18" y="78" class="sm">When something is deliberately sacrificed, or an extraordinary expense is deliberately incurred,</text>
    <text x="18" y="94" class="sm">to save the whole adventure from a real peril, everyone who benefited shares the loss in</text>
    <text x="18" y="110" class="sm">proportion to the value saved — ship, cargo and freight together.</text>

    <text x="18" y="140" class="it">Typical acts</text>
    <text x="18" y="160" class="sm">Jettison of cargo · flooding a hold to fight a fire · a tug hired to refloat after grounding ·</text>
    <text x="18" y="176" class="sm">putting into a port of refuge and the costs of doing so.</text>

    <text x="18" y="198" class="sm">Cargo is released against an average bond and a guarantee; the adjuster settles it afterwards.</text>
  </g>
</svg>
