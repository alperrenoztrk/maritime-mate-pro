<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:13px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:11px sans-serif;fill:#475569}
      .fx{font:14px sans-serif;fill:#0f172a;font-weight:700}
    </style>
  </defs>
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">Ship Cost Structure and Time Charter Equivalent</text>

  <!-- cost layers -->
  <g transform="translate(20 46)">
    <rect width="380" height="360" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="28" class="hd">Four layers of cost</text>

    <g transform="translate(18 44)">
      <rect width="344" height="66" rx="8" fill="#1e3a8a"/>
      <text x="16" y="26" class="it" style="fill:#ffffff">Capital cost</text>
      <text x="16" y="46" class="sm" style="fill:#dbeafe">Purchase or newbuilding finance, loan interest,</text>
      <text x="16" y="60" class="sm" style="fill:#dbeafe">depreciation. Fixed, whether trading or idle.</text>
    </g>

    <g transform="translate(18 118)">
      <rect width="344" height="66" rx="8" fill="#1d4ed8"/>
      <text x="16" y="26" class="it" style="fill:#ffffff">Operating cost (OPEX)</text>
      <text x="16" y="46" class="sm" style="fill:#dbeafe">Crew wages, stores, lube oil, repair and</text>
      <text x="16" y="60" class="sm" style="fill:#dbeafe">maintenance, insurance, class and surveys.</text>
    </g>

    <g transform="translate(18 192)">
      <rect width="344" height="66" rx="8" fill="#b45309"/>
      <text x="16" y="26" class="it" style="fill:#ffffff">Voyage cost</text>
      <text x="16" y="46" class="sm" style="fill:#fef3c7">Bunkers, port dues, pilotage, towage, canal</text>
      <text x="16" y="60" class="sm" style="fill:#fef3c7">transit. Varies with the voyage actually run.</text>
    </g>

    <g transform="translate(18 266)">
      <rect width="344" height="66" rx="8" fill="#15803d"/>
      <text x="16" y="26" class="it" style="fill:#ffffff">Cargo handling cost</text>
      <text x="16" y="46" class="sm" style="fill:#dcfce7">Loading, stowing, trimming, lashing and</text>
      <text x="16" y="60" class="sm" style="fill:#dcfce7">discharge, as allocated by the charter party.</text>
    </g>
  </g>

  <!-- TCE -->
  <g transform="translate(416 46)">
    <rect width="284" height="360" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="18" y="28" class="hd" style="fill:#1d4ed8">Time Charter Equivalent</text>

    <text x="18" y="56" class="sm">TCE turns a voyage fixture into a daily rate,</text>
    <text x="18" y="72" class="sm">so a voyage charter and a time charter can</text>
    <text x="18" y="88" class="sm">be compared on the same basis.</text>

    <rect x="18" y="106" width="248" height="86" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="142" y="136" text-anchor="middle" class="fx">Voyage revenue − Voyage cost</text>
    <path d="M34,148 H250" stroke="#0f172a" stroke-width="1.5"/>
    <text x="142" y="172" text-anchor="middle" class="fx">Voyage duration (days)</text>

    <text x="18" y="220" class="it">What it does and does not include</text>
    <text x="18" y="244" class="sm">Voyage cost here means bunkers, port dues</text>
    <text x="18" y="260" class="sm">and canal transit — the costs the owner</text>
    <text x="18" y="276" class="sm">carries on a voyage charter.</text>
    <text x="18" y="300" class="sm">OPEX and capital cost are NOT deducted.</text>
    <text x="18" y="316" class="sm">TCE is compared against them afterwards to</text>
    <text x="18" y="332" class="sm">see whether the voyage actually pays.</text>
  </g>
</svg>
