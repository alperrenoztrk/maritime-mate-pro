<svg width="720" height="466" viewBox="0 0 720 466" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:13px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:11px sans-serif;fill:#475569}
      .num{font:13px sans-serif;fill:#ffffff;font-weight:700}
    </style>
  </defs>
  <rect width="720" height="466" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">Bill of Lading — Three Functions</text>

  <!-- three functions -->
  <g transform="translate(20 44)">
    <rect width="680" height="176" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>

    <g transform="translate(18 26)">
      <circle cx="14" cy="14" r="14" fill="#1d4ed8"/><text x="14" y="19" text-anchor="middle" class="num">1</text>
      <text x="42" y="12" class="it">Receipt for the goods</text>
      <text x="42" y="30" class="sm">States the quantity and the apparent order and condition as shipped.</text>
    </g>

    <g transform="translate(18 76)">
      <circle cx="14" cy="14" r="14" fill="#1d4ed8"/><text x="14" y="19" text-anchor="middle" class="num">2</text>
      <text x="42" y="12" class="it">Evidence of the contract of carriage</text>
      <text x="42" y="30" class="sm">Not the contract itself — under a charter party the C/P governs.</text>
    </g>

    <g transform="translate(18 126)">
      <circle cx="14" cy="14" r="14" fill="#1d4ed8"/><text x="14" y="19" text-anchor="middle" class="num">3</text>
      <text x="42" y="12" class="it">Document of title</text>
      <text x="42" y="30" class="sm">The holder of an original can claim the cargo, so one must be surrendered</text>
      <text x="42" y="46" class="sm">before delivery; releasing without it is done only against an indemnity.</text>
    </g>
  </g>

  <!-- clean vs claused -->
  <g transform="translate(20 234)">
    <rect width="332" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="18" y="28" class="hd" style="fill:#15803d">Clean</text>
    <text x="18" y="52" class="sm">No clause recording defective condition of</text>
    <text x="18" y="68" class="sm">the cargo or its packaging.</text>
    <text x="18" y="92" class="sm">Banks require a clean bill under a letter</text>
    <text x="18" y="108" class="sm">of credit.</text>
  </g>

  <g transform="translate(368 234)">
    <rect width="332" height="120" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="18" y="28" class="hd" style="fill:#b91c1c">Claused (dirty)</text>
    <text x="18" y="52" class="sm">Carries a remark such as torn bags or rust</text>
    <text x="18" y="68" class="sm">staining, taken from the mate's receipt.</text>
    <text x="18" y="92" class="sm">Never sign a clean bill for cargo you have</text>
    <text x="18" y="108" class="sm">claused — that is a false statement.</text>
  </g>

  <!-- consignee forms -->
  <g transform="translate(20 368)">
    <rect width="680" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="26" class="hd">How the consignee is named</text>
    <text x="18" y="50" class="it">Straight</text>
    <text x="90" y="50" class="sm">to a named consignee; not transferable.</text>
    <text x="18" y="70" class="it">Order</text>
    <text x="90" y="70" class="sm">"to order" and endorsed — the negotiable form used in trade.</text>
    <text x="386" y="50" class="it">Bearer</text>
    <text x="452" y="50" class="sm">whoever holds it; rare.</text>
  </g>
</svg>
