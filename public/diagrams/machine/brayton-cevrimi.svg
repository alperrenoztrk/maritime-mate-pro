<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" rx="8" fill="#f1f5f9"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="Arial">Brayton Cycle (P-v Diagram)</text>

  <!-- Eksenler -->
  <line x1="80" y1="340" x2="540" y2="340" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="340" x2="80" y2="50" stroke="#334155" stroke-width="2"/>
  <path d="M540 340 L530 334 L530 346 Z" fill="#334155"/>
  <path d="M80 50 L74 60 L86 60 Z" fill="#334155"/>
  <text x="310" y="375" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial">Specific volume v (m³/kg)</text>
  <text x="30" y="200" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial" transform="rotate(-90 30 200)">Pressure P (kPa)</text>

  <!-- 1: düşük P, yüksek v (girişten önce ortam)
       2: yüksek P, küçük v (kompresör çıkışı)
       3: yüksek P, büyük v (yanma odası çıkışı, sabit P ısı alımı)
       4: düşük P, çok büyük v (türbin çıkışı) -->
  <!-- 1→2 adyabatik sıkıştırma -->
  <path d="M460 290 Q300 200 180 120" fill="none" stroke="#16a34a" stroke-width="3"/>
  <!-- 2→3 sabit basınç ısı alımı -->
  <line x1="180" y1="120" x2="320" y2="120" stroke="#ef4444" stroke-width="3"/>
  <!-- 3→4 adyabatik genleşme -->
  <path d="M320 120 Q400 200 500 300" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- 4→1 sabit basınç ısı atımı -->
  <line x1="500" y1="300" x2="460" y2="290" stroke="#f59e0b" stroke-width="3"/>
  <line x1="500" y1="300" x2="460" y2="300" stroke="#f59e0b" stroke-width="3"/>
  <line x1="180" y1="290" x2="500" y2="290" stroke="#f59e0b" stroke-width="3" opacity="0"/>
  <!-- Yatay alt 4→1 düzeltme -->
  <line x1="500" y1="290" x2="460" y2="290" stroke="#f59e0b" stroke-width="3"/>

  <!-- Noktalar -->
  <circle cx="460" cy="290" r="5" fill="#0f172a"/><text x="468" y="306" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">1</text>
  <circle cx="180" cy="120" r="5" fill="#0f172a"/><text x="160" y="116" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">2</text>
  <circle cx="320" cy="120" r="5" fill="#0f172a"/><text x="328" y="116" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">3</text>
  <circle cx="500" cy="290" r="5" fill="#0f172a"/><text x="508" y="306" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">4</text>

  <!-- Verim formülü -->
  <rect x="120" y="335" width="360" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="300" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a" font-family="Arial">η_Brayton = 1 − (1/rp)^((γ−1)/γ)</text>

  <!-- Lejant -->
  <circle cx="450" cy="80" r="4" fill="#16a34a"/><text x="458" y="84" font-size="9" fill="#334155" font-family="Arial">1→2 Compressor (adiabatic)</text>
  <circle cx="450" cy="100" r="4" fill="#ef4444"/><text x="458" y="104" font-size="9" fill="#334155" font-family="Arial">2→3 Combustion (constant P)</text>
  <circle cx="450" cy="120" r="4" fill="#2563eb"/><text x="458" y="124" font-size="9" fill="#334155" font-family="Arial">3→4 Turbine (adiabatic)</text>
  <circle cx="450" cy="140" r="4" fill="#f59e0b"/><text x="458" y="144" font-size="9" fill="#334155" font-family="Arial">4→1 Exhaust (constant P)</text>
</svg>
