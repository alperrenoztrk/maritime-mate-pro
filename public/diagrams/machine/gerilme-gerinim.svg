<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420">
  <rect width="620" height="420" rx="8" fill="#f1f5f9"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="Arial">Gerilme–Gerinim Diyagramı (Çelik)</text>

  <!-- Eksenler -->
  <line x1="80" y1="360" x2="560" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="360" x2="80" y2="50" stroke="#334155" stroke-width="2"/>
  <path d="M560 360 L550 354 L550 366 Z" fill="#334155"/>
  <path d="M80 50 L74 60 L86 60 Z" fill="#334155"/>
  <text x="320" y="400" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial">Gerinim (ε)</text>
  <text x="30" y="210" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial" transform="rotate(-90 30 210)">Gerilme (σ) MPa</text>

  <!-- Eğri -->
  <!-- Elastik bölge -->
  <line x1="80" y1="360" x2="180" y2="180" stroke="#2563eb" stroke-width="3"/>
  <!-- Akma noktası -->
  <path d="M180 180 Q200 175 220 182 Q240 190 250 178" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- Pekleşme -->
  <path d="M250 178 Q320 100 400 95" fill="none" stroke="#16a34a" stroke-width="3"/>
  <!-- Boyun verme ve kopma -->
  <path d="M400 95 Q440 97 470 130 Q490 170 500 200" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Noktalar -->
  <circle cx="180" cy="180" r="5" fill="#f59e0b"/>
  <text x="155" y="170" font-size="10" fill="#f59e0b" font-family="Arial" font-weight="bold">Akma (σ_y)</text>
  
  <circle cx="400" cy="95" r="5" fill="#16a34a"/>
  <text x="370" y="80" font-size="10" fill="#16a34a" font-family="Arial" font-weight="bold">Çekme Dayanımı (σ_u)</text>

  <circle cx="500" cy="200" r="5" fill="#ef4444"/>
  <text x="505" y="195" font-size="10" fill="#ef4444" font-family="Arial" font-weight="bold">Kopma</text>

  <!-- Bölge etiketleri -->
  <rect x="95" y="280" width="70" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="130" y="300" text-anchor="middle" font-size="9" fill="#1e3a8a" font-family="Arial">Elastik</text>

  <rect x="195" y="230" width="70" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="230" y="250" text-anchor="middle" font-size="9" fill="#92400e" font-family="Arial">Akma</text>

  <rect x="300" y="140" width="70" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="335" y="160" text-anchor="middle" font-size="9" fill="#166534" font-family="Arial">Pekleşme</text>

  <rect x="430" y="140" width="80" height="30" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="470" y="160" text-anchor="middle" font-size="9" fill="#991b1b" font-family="Arial">Boyun verme</text>

  <!-- Hooke yasası -->
  <text x="130" y="245" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Arial">σ = E · ε</text>

  <!-- Lejant -->
  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">E = Elastisite Modülü (Young Modülü) ≈ 210 GPa (çelik)</text>
</svg>