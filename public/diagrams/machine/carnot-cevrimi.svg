<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" rx="8" fill="#f1f5f9"/>
  <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="Arial">Carnot Çevrimi</text>

  <!-- Eksenler -->
  <line x1="80" y1="340" x2="540" y2="340" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="340" x2="80" y2="50" stroke="#334155" stroke-width="2"/>
  <path d="M540 340 L530 334 L530 346 Z" fill="#334155"/>
  <path d="M80 50 L74 60 L86 60 Z" fill="#334155"/>
  <text x="310" y="375" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial">Entropi (S)</text>
  <text x="30" y="200" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial" transform="rotate(-90 30 200)">Sıcaklık (T)</text>

  <!-- Carnot dikdörtgeni T-S -->
  <!-- 1→2 İzotermal genişleme (üst) -->
  <line x1="160" y1="100" x2="420" y2="100" stroke="#ef4444" stroke-width="3"/>
  <path d="M420 100 L410 94 L410 106 Z" fill="#ef4444"/>
  <text x="290" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444" font-family="Arial">T_H (Sıcak Kaynak)</text>

  <!-- 2→3 Adyabatik genişleme (sağ) -->
  <line x1="420" y1="100" x2="420" y2="280" stroke="#16a34a" stroke-width="3"/>
  <path d="M420 280 L414 270 L426 270 Z" fill="#16a34a"/>

  <!-- 3→4 İzotermal sıkıştırma (alt) -->
  <line x1="420" y1="280" x2="160" y2="280" stroke="#2563eb" stroke-width="3"/>
  <path d="M160 280 L170 274 L170 286 Z" fill="#2563eb"/>
  <text x="290" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb" font-family="Arial">T_C (Soğuk Kaynak)</text>

  <!-- 4→1 Adyabatik sıkıştırma (sol) -->
  <line x1="160" y1="280" x2="160" y2="100" stroke="#f59e0b" stroke-width="3"/>
  <path d="M160 100 L154 110 L166 110 Z" fill="#f59e0b"/>

  <!-- Taralı alan -->
  <rect x="160" y="100" width="260" height="180" fill="#3b82f6" opacity="0.08"/>
  <text x="290" y="195" text-anchor="middle" font-size="13" fill="#1e3a8a" font-family="Arial" font-weight="bold">W_net</text>

  <!-- Köşe noktaları -->
  <circle cx="160" cy="100" r="5" fill="#0f172a"/>
  <text x="145" y="92" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">1</text>
  <circle cx="420" cy="100" r="5" fill="#0f172a"/>
  <text x="430" y="92" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">2</text>
  <circle cx="420" cy="280" r="5" fill="#0f172a"/>
  <text x="430" y="292" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">3</text>
  <circle cx="160" cy="280" r="5" fill="#0f172a"/>
  <text x="145" y="292" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">4</text>

  <!-- Verim formülü -->
  <rect x="140" y="330" width="320" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="300" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a" font-family="Arial">η_Carnot = 1 − T_C / T_H</text>

  <!-- Lejant -->
  <circle cx="470" cy="130" r="4" fill="#ef4444"/>
  <text x="480" y="134" font-size="9" fill="#334155" font-family="Arial">İzotermal genişleme</text>
  <circle cx="470" cy="150" r="4" fill="#16a34a"/>
  <text x="480" y="154" font-size="9" fill="#334155" font-family="Arial">Adyabatik genişleme</text>
  <circle cx="470" cy="170" r="4" fill="#2563eb"/>
  <text x="480" y="174" font-size="9" fill="#334155" font-family="Arial">İzotermal sıkıştırma</text>
  <circle cx="470" cy="190" r="4" fill="#f59e0b"/>
  <text x="480" y="194" font-size="9" fill="#334155" font-family="Arial">Adyabatik sıkıştırma</text>
</svg>