<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <rect width="800" height="320" rx="8" fill="#f1f5f9"/>

  <!-- Kapalı Sistem -->
  <rect x="40" y="60" width="200" height="160" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a" font-family="Arial">Kapalı Sistem</text>
  <circle cx="140" cy="140" r="40" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="145" text-anchor="middle" font-size="12" fill="#1e3a8a" font-family="Arial">Kütle</text>
  <!-- Enerji okları -->
  <path d="M60 85 L60 65" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="60" y="60" text-anchor="middle" font-size="10" fill="#ef4444" font-family="Arial">Q</text>
  <path d="M220 85 L220 65" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="220" y="60" text-anchor="middle" font-size="10" fill="#f59e0b" font-family="Arial">W</text>
  <text x="140" y="240" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">Kütle geçişi ✗</text>
  <text x="140" y="255" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">Enerji geçişi ✓</text>

  <!-- Açık Sistem -->
  <rect x="300" y="60" width="200" height="160" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534" font-family="Arial">Açık Sistem</text>
  <circle cx="400" cy="140" r="40" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" font-size="12" fill="#166534" font-family="Arial">Kütle</text>
  <!-- Kütle okları -->
  <path d="M280 140 L310 140" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="275" y="135" text-anchor="end" font-size="10" fill="#16a34a" font-family="Arial">ṁ giren</text>
  <path d="M490 140 L520 140" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="525" y="135" text-anchor="start" font-size="10" fill="#16a34a" font-family="Arial">ṁ çıkan</text>
  <text x="400" y="240" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">Kütle geçişi ✓</text>
  <text x="400" y="255" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">Enerji geçişi ✓</text>

  <!-- Yalıtılmış Sistem -->
  <rect x="560" y="60" width="200" height="160" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="660" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e" font-family="Arial">Yalıtılmış Sistem</text>
  <circle cx="660" cy="140" r="40" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="145" text-anchor="middle" font-size="12" fill="#92400e" font-family="Arial">Kütle</text>
  <text x="660" y="240" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">Kütle geçişi ✗</text>
  <text x="660" y="255" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">Enerji geçişi ✗</text>

  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#475569" font-family="Arial">Şekil: Termodinamik Sistem Sınıflandırması</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>