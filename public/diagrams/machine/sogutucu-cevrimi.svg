<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <rect width="700" height="380" rx="8" fill="#f1f5f9"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="Arial">Soğutma Çevrimi (Buhar Sıkıştırmalı)</text>

  <!-- Kompresör -->
  <rect x="50" y="140" width="110" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a" font-family="Arial">Kompresör</text>
  <text x="105" y="195" text-anchor="middle" font-size="9" fill="#1e3a8a" font-family="Arial">W giriş</text>

  <!-- Kondenser -->
  <rect x="280" y="40" width="140" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b" font-family="Arial">Kondenser</text>
  <text x="350" y="90" text-anchor="middle" font-size="9" fill="#991b1b" font-family="Arial">Q_H (ısı atma)</text>

  <!-- Genleşme valfi -->
  <rect x="530" y="140" width="120" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="590" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e" font-family="Arial">Genleşme</text>
  <text x="590" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e" font-family="Arial">Valfi</text>

  <!-- Evaporatör -->
  <rect x="280" y="260" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a" font-family="Arial">Evaporatör</text>
  <text x="350" y="310" text-anchor="middle" font-size="9" fill="#1e3a8a" font-family="Arial">Q_C (ısı alma)</text>

  <!-- Akış okları -->
  <!-- Kompresör → Kondenser -->
  <path d="M160 160 L280 80" stroke="#ef4444" stroke-width="2.5" marker-end="url(#aRed)"/>
  <text x="200" y="108" font-size="9" fill="#ef4444" font-family="Arial">Yüksek P, Sıcak gaz</text>

  <!-- Kondenser → Genleşme valfi -->
  <path d="M420 80 L530 160" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aAmber)"/>
  <text x="490" y="108" font-size="9" fill="#92400e" font-family="Arial">Sıvı</text>

  <!-- Genleşme valfi → Evaporatör -->
  <path d="M530 200 L420 275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="490" y="255" font-size="9" fill="#2563eb" font-family="Arial">Düşük P, Soğuk</text>

  <!-- Evaporatör → Kompresör -->
  <path d="M280 290 L160 200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="200" y="260" font-size="9" fill="#16a34a" font-family="Arial">Buhar</text>

  <!-- Alt bilgi -->
  <text x="350" y="360" text-anchor="middle" font-size="10" fill="#64748b" font-family="Arial">Soğutucu akışkan: R134a, R407C, R410A | COP = Q_C / W</text>

  <defs>
    <marker id="aRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
    <marker id="aAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="aBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="aGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>