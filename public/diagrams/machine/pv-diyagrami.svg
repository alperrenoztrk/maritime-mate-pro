<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <rect width="600" height="420" rx="8" fill="#f1f5f9"/>
  <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a" font-family="Arial">Diesel Cycle P-V Diagram</text>

  <!-- Eksenler -->
  <line x1="80" y1="350" x2="540" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="350" x2="80" y2="50" stroke="#334155" stroke-width="2"/>
  <path d="M540 350 L530 344 L530 356 Z" fill="#334155"/>
  <path d="M80 50 L74 60 L86 60 Z" fill="#334155"/>
  <text x="300" y="390" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial">Volume (V)</text>
  <text x="30" y="200" text-anchor="middle" font-size="13" fill="#334155" font-family="Arial" transform="rotate(-90 30 200)">Pressure (P)</text>

  <!-- Dizel çevrimi -->
  <!-- 1→2 Adyabatik sıkıştırma -->
  <path d="M460 310 Q200 200 130 90" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M130 90 L138 100 L125 102 Z" fill="#2563eb"/>
  
  <!-- 2→3 Sabit basınçta ısı eklenmesi -->
  <line x1="130" y1="90" x2="240" y2="90" stroke="#ef4444" stroke-width="3"/>
  <path d="M240 90 L230 84 L230 96 Z" fill="#ef4444"/>

  <!-- 3→4 Adyabatik genişleme -->
  <path d="M240 90 Q350 180 460 280" fill="none" stroke="#16a34a" stroke-width="3"/>
  <path d="M460 280 L448 278 L452 290 Z" fill="#16a34a"/>

  <!-- 4→1 Sabit hacimde ısı atılması -->
  <line x1="460" y1="280" x2="460" y2="310" stroke="#8b5cf6" stroke-width="3"/>
  <path d="M460 310 L454 300 L466 300 Z" fill="#8b5cf6"/>

  <!-- Nokta etiketleri -->
  <circle cx="460" cy="310" r="6" fill="#0f172a"/>
  <text x="475" y="325" font-size="14" font-weight="bold" fill="#0f172a" font-family="Arial">1</text>
  <circle cx="130" cy="90" r="6" fill="#0f172a"/>
  <text x="115" y="82" font-size="14" font-weight="bold" fill="#0f172a" font-family="Arial">2</text>
  <circle cx="240" cy="90" r="6" fill="#0f172a"/>
  <text x="250" y="82" font-size="14" font-weight="bold" fill="#0f172a" font-family="Arial">3</text>
  <circle cx="460" cy="280" r="6" fill="#0f172a"/>
  <text x="475" y="275" font-size="14" font-weight="bold" fill="#0f172a" font-family="Arial">4</text>

  <!-- Açıklamalar -->
  <rect x="100" y="360" width="400" height="50" rx="6" fill="none"/>
  <circle cx="120" cy="375" r="5" fill="#2563eb"/>
  <text x="130" y="379" font-size="10" fill="#334155" font-family="Arial">1→2 Adiabatic compression</text>
  <circle cx="300" cy="375" r="5" fill="#ef4444"/>
  <text x="310" y="379" font-size="10" fill="#334155" font-family="Arial">2→3 Constant P, heat added</text>
  <circle cx="120" cy="395" r="5" fill="#16a34a"/>
  <text x="130" y="399" font-size="10" fill="#334155" font-family="Arial">3→4 Adiabatic expansion</text>
  <circle cx="300" cy="395" r="5" fill="#8b5cf6"/>
  <text x="310" y="399" font-size="10" fill="#334155" font-family="Arial">4→1 Constant V, heat rejected</text>
</svg>