<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:14px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:11px sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">SOLAS V — Tehlike Mesajları ve İçeriği</text>

  <!-- left panel: reportable dangers (V/31) -->
  <g transform="translate(20 50)">
    <rect width="330" height="380" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="18" y="32" class="hd" fill="#b91c1c">Bildirilecek Tehlikeler (V/31)</text>
    <g transform="translate(18 56)">
      <circle cx="8" cy="8" r="6" fill="#dc2626"/><text x="26" y="12" class="it">Tehlikeli buz / buzdağı</text>
      <circle cx="8" cy="56" r="6" fill="#dc2626"/><text x="26" y="60" class="it">Terk edilmiş gemi (derelict) /</text><text x="26" y="78" class="it">seyir engeli</text>
      <circle cx="8" cy="118" r="6" fill="#dc2626"/><text x="26" y="122" class="it">Tropikal fırtına ile karşılaşma</text>
      <circle cx="8" cy="166" r="6" fill="#dc2626"/><text x="26" y="170" class="it">Ağır buzlanma (donma altı sıcaklık</text><text x="26" y="188" class="it">+ fırtına rüzgârı)</text>
      <circle cx="8" cy="228" r="6" fill="#dc2626"/><text x="26" y="232" class="it">İhbar edilmemiş ≥ 10 Bofor rüzgâr</text>
    </g>
    <text x="18" y="352" class="sm">Mesajlar ücretsizdir; tüm imkânlarla</text>
    <text x="18" y="368" class="sm">derhâl yakındaki gemilere ve makama iletilir.</text>
  </g>

  <!-- right panel: tropical storm message content (V/32) -->
  <g transform="translate(370 50)">
    <rect width="330" height="380" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="18" y="32" class="hd" fill="#1d4ed8">Tropikal Fırtına Mesajı (V/32)</text>
    <g transform="translate(18 56)">
      <text x="0" y="12" class="it">1 · Tropikal fırtına beyanı</text>
      <text x="0" y="50" class="it">2 · Zaman ve mevki (UTC)</text>
      <text x="0" y="88" class="it">3 · Barometre basıncı + 3 saatlik</text><text x="14" y="106" class="it">eğilim (tendency)</text>
      <text x="0" y="144" class="it">4 · Gerçek rüzgâr yönü ve Bofor şiddeti</text>
      <text x="0" y="182" class="it">5 · Deniz durumu ve ölü deniz (swell)</text>
      <text x="0" y="220" class="it">6 · Geminin rota ve hızı</text>
      <text x="0" y="262" class="sm">Buzlanmada ayrıca hava/deniz sıcaklığı</text>
      <text x="0" y="280" class="sm">ve rüzgâr eklenir; takip gözlemleri gönderilir.</text>
    </g>
  </g>

  <text x="360" y="456" text-anchor="middle" class="sm">V/34: sefer planı hava bilgisini içerir · V/5: gemiler VOS kapsamında hava raporlar</text>
</svg>
