<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:14px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:11px sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">SOLAS V — Danger Messages and Their Content</text>

  <!-- left panel: reportable dangers (V/31) -->
  <g transform="translate(20 50)">
    <rect width="330" height="380" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="18" y="32" class="hd" fill="#b91c1c">Dangers to Be Reported (V/31)</text>
    <g transform="translate(18 56)">
      <circle cx="8" cy="8" r="6" fill="#dc2626"/><text x="26" y="12" class="it">Dangerous ice / iceberg</text>
      <circle cx="8" cy="56" r="6" fill="#dc2626"/><text x="26" y="60" class="it">Derelict vessel /</text><text x="26" y="78" class="it">obstruction to navigation</text>
      <circle cx="8" cy="118" r="6" fill="#dc2626"/><text x="26" y="122" class="it">Encountering a tropical storm</text>
      <circle cx="8" cy="166" r="6" fill="#dc2626"/><text x="26" y="170" class="it">Severe icing (sub-zero temperature</text><text x="26" y="188" class="it">+ gale-force wind)</text>
      <circle cx="8" cy="228" r="6" fill="#dc2626"/><text x="26" y="232" class="it">Unforecast winds of Beaufort ≥ 10</text>
    </g>
    <text x="18" y="352" class="sm">Messages are free of charge and sent</text>
    <text x="18" y="368" class="sm">at once to ships nearby and to the authority.</text>
  </g>

  <!-- right panel: tropical storm message content (V/32) -->
  <g transform="translate(370 50)">
    <rect width="330" height="380" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="18" y="32" class="hd" fill="#1d4ed8">Tropical Storm Message (V/32)</text>
    <g transform="translate(18 56)">
      <text x="0" y="12" class="it">1 · Statement that a tropical storm is met</text>
      <text x="0" y="50" class="it">2 · Time and position (UTC)</text>
      <text x="0" y="88" class="it">3 · Barometric pressure + 3-hourly</text><text x="14" y="106" class="it">tendency</text>
      <text x="0" y="144" class="it">4 · True wind direction and Beaufort force</text>
      <text x="0" y="182" class="it">5 · State of sea and swell</text>
      <text x="0" y="220" class="it">6 · Ship's course and speed</text>
      <text x="0" y="262" class="sm">For icing, air/sea temperature and wind</text>
      <text x="0" y="280" class="sm">are added; follow-up observations are sent.</text>
    </g>
  </g>

  <text x="360" y="456" text-anchor="middle" class="sm">V/34: the passage plan includes weather data · V/5: ships report weather under VOS</text>
</svg>
