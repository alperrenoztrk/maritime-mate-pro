<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:14px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:11px sans-serif;fill:#475569}
      .guide{stroke:#94a3b8;stroke-width:1;stroke-dasharray:6 5;fill:none}
      .wave{fill:none;stroke:#0369a1;stroke-width:3}
    </style>
  </defs>
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">Wave Parameters, Wind Sea and Swell</text>

  <!-- panel A: wave anatomy -->
  <g transform="translate(20 44)">
    <rect width="680" height="210" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="18" y="26" class="hd" fill="#0369a1">Anatomy of a Wave</text>

    <!-- still water level -->
    <path d="M40,120 H420" class="guide"/>
    <text x="26" y="124" text-anchor="end" class="sm">Still</text>

    <!-- the wave -->
    <path d="M40,120 Q70,40 100,120 Q130,200 160,120 Q190,40 220,120 Q250,200 280,120 Q310,40 340,120 Q370,200 400,120" class="wave"/>

    <!-- crest / trough levels -->
    <path d="M70,80 H445" class="guide"/>
    <path d="M130,160 H445" class="guide"/>
    <text x="76" y="72" class="sm">Crest</text>
    <text x="136" y="176" class="sm">Trough</text>

    <!-- wave height: double arrow between crest and trough levels -->
    <path d="M436,80 V160" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M-5,6 L0,-3 L5,6 z" fill="#0f172a" transform="translate(436 80)"/>
    <path d="M-5,-6 L0,3 L5,-6 z" fill="#0f172a" transform="translate(436 160)"/>
    <text x="458" y="116" class="it">H — wave height</text>
    <text x="458" y="136" class="sm">crest to trough</text>

    <!-- wavelength: crest to crest -->
    <path d="M70,186 H190" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M6,-5 L-3,0 L6,5 z" fill="#0f172a" transform="translate(70 186)"/>
    <path d="M-6,-5 L3,0 L-6,5 z" fill="#0f172a" transform="translate(190 186)"/>
    <text x="130" y="202" text-anchor="middle" class="sm">L — wavelength</text>

    <text x="458" y="166" class="it">T — period</text>
    <text x="458" y="186" class="sm">time between two crests</text>
  </g>

  <!-- panel B: wind sea vs swell -->
  <g transform="translate(20 268)">
    <rect width="680" height="145" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

    <text x="18" y="26" class="hd">Wind Sea</text>
    <path d="M18,70 Q34,44 50,70 Q66,96 82,70 Q98,44 114,70 Q130,96 146,70 Q162,44 178,70 Q194,96 210,70 Q226,44 242,70 Q258,96 274,70 Q290,44 306,70" class="wave"/>
    <text x="18" y="104" class="sm">Short, steep and irregular. Raised by the</text>
    <text x="18" y="120" class="sm">local wind blowing now; dies down with it.</text>

    <text x="366" y="26" class="hd">Swell</text>
    <path d="M366,70 Q404,46 442,70 Q480,94 518,70 Q556,46 594,70 Q632,94 662,70" class="wave"/>
    <text x="366" y="104" class="sm">Long, low and regular. Travels out of a</text>
    <text x="366" y="120" class="sm">distant system and outlives the wind.</text>
  </g>
</svg>
