<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a" font-family="Arial">Mooring Arrangement — Plan View</text>

  <!-- Quay/Berth -->
  <rect x="50" y="40" width="800" height="50" rx="4" fill="#d6d3d1" stroke="#78716c" stroke-width="2"/>
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#44403c" font-family="Arial">Q U A Y</text>
  <!-- Bollards on quay -->
  <circle cx="150" cy="85" r="6" fill="#57534e" stroke="#292524" stroke-width="1.5"/>
  <circle cx="300" cy="85" r="6" fill="#57534e" stroke="#292524" stroke-width="1.5"/>
  <circle cx="450" cy="85" r="6" fill="#57534e" stroke="#292524" stroke-width="1.5"/>
  <circle cx="600" cy="85" r="6" fill="#57534e" stroke="#292524" stroke-width="1.5"/>
  <circle cx="750" cy="85" r="6" fill="#57534e" stroke="#292524" stroke-width="1.5"/>

  <!-- Ship (top view) -->
  <path d="M200 160 L750 160 L780 220 L750 280 L200 280 L160 220 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <!-- Bow marker -->
  <path d="M160 220 L130 220" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="224" text-anchor="end" font-size="11" fill="#dc2626" font-family="Arial">Bow</text>
  <!-- Stern marker -->
  <path d="M780 220 L810 220" stroke="#dc2626" stroke-width="2"/>
  <text x="820" y="224" font-size="11" fill="#dc2626" font-family="Arial">Stern</text>

  <!-- Mooring Lines -->
  <!-- Head Line (forward) -->
  <line x1="200" y1="170" x2="150" y2="85" stroke="#2563eb" stroke-width="2.5"/>
  <text x="145" y="130" font-size="10" font-weight="bold" fill="#2563eb" font-family="Arial">Head Line</text>

  <!-- Forward Breast -->
  <line x1="300" y1="160" x2="300" y2="85" stroke="#059669" stroke-width="2.5"/>
  <text x="310" y="130" font-size="10" font-weight="bold" fill="#059669" font-family="Arial">Fwd Breast</text>

  <!-- Forward Spring -->
  <line x1="320" y1="165" x2="450" y2="85" stroke="#d97706" stroke-width="2.5"/>
  <text x="370" y="115" font-size="10" font-weight="bold" fill="#d97706" font-family="Arial">Fwd Spring</text>

  <!-- After Spring -->
  <line x1="580" y1="165" x2="450" y2="85" stroke="#d97706" stroke-width="2.5"/>
  <text x="490" y="115" font-size="10" font-weight="bold" fill="#d97706" font-family="Arial">Aft Spring</text>

  <!-- After Breast -->
  <line x1="620" y1="160" x2="600" y2="85" stroke="#059669" stroke-width="2.5"/>
  <text x="590" y="130" font-size="10" font-weight="bold" fill="#059669" font-family="Arial">Aft Breast</text>

  <!-- Stern Line -->
  <line x1="730" y1="170" x2="750" y2="85" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="735" y="130" font-size="10" font-weight="bold" fill="#7c3aed" font-family="Arial">Stern Line</text>

  <!-- Legend -->
  <rect x="100" y="310" width="700" height="70" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="335" x2="160" y2="335" stroke="#2563eb" stroke-width="2.5"/>
  <text x="165" y="339" font-size="10" fill="#0f172a" font-family="Arial">Head/Stern Line: prevents fore-and-aft movement</text>

  <line x1="130" y1="355" x2="160" y2="355" stroke="#059669" stroke-width="2.5"/>
  <text x="165" y="359" font-size="10" fill="#0f172a" font-family="Arial">Breast Line: prevents the ship moving off the quay</text>

  <line x1="500" y1="335" x2="530" y2="335" stroke="#d97706" stroke-width="2.5"/>
  <text x="535" y="339" font-size="10" fill="#0f172a" font-family="Arial">Spring Line: prevents surging along the quay</text>
</svg>