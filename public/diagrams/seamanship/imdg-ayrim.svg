<svg viewBox="0 0 720 490" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .nm{font:13px sans-serif;fill:#0f172a;font-weight:700}
      .sm{font:10.5px sans-serif;fill:#475569}
      .hull{fill:#f1f5f9;stroke:#0f172a;stroke-width:2}
      .bhd{stroke:#0f172a;stroke-width:2}
      .pa{fill:#dc2626}
      .pb{fill:#2563eb}
      .dim{stroke:#16a34a;stroke-width:1.5}
      .pl{font:11px sans-serif;fill:#fff;font-weight:700;text-anchor:middle}
    </style>
    <marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,4 L8,1 L8,7 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="720" height="490" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">IMDG Segregation Levels</text>
  <text x="360" y="46" text-anchor="middle" class="sm">Red (A) and blue (B) are two incompatible dangerous goods</text>

  <!-- P1 Away from -->
  <text x="40" y="80" class="nm">1 · AWAY FROM</text>
  <text x="40" y="96" class="sm">Same hold, ≥ 3 m horizontally</text>
  <rect class="hull" x="40" y="108" width="300" height="78"/>
  <rect class="pa" x="70" y="138" width="40" height="36"/><text x="90" y="161" class="pl">A</text>
  <rect class="pb" x="262" y="138" width="40" height="36"/><text x="282" y="161" class="pl">B</text>
  <line class="dim" x1="112" y1="156" x2="260" y2="156" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="186" y="150" text-anchor="middle" class="sm" fill="#16a34a">≥ 3 m</text>

  <!-- P2 Separated from -->
  <text x="390" y="80" class="nm">2 · SEPARATED FROM</text>
  <text x="390" y="96" class="sm">Different compartment; ≥ 6 m on deck</text>
  <rect class="hull" x="390" y="108" width="300" height="78"/>
  <line class="bhd" x1="540" y1="108" x2="540" y2="186"/>
  <rect class="pa" x="430" y="138" width="40" height="36"/><text x="450" y="161" class="pl">A</text>
  <rect class="pb" x="610" y="138" width="40" height="36"/><text x="630" y="161" class="pl">B</text>
  <text x="540" y="202" text-anchor="middle" class="sm">one bulkhead</text>

  <!-- P3 Separated by a complete compartment -->
  <text x="40" y="300" class="nm">3 · SEPARATED BY A COMPLETE COMPARTMENT</text>
  <text x="40" y="316" class="sm">At least one complete hold or compartment between them</text>
  <rect class="hull" x="40" y="328" width="300" height="78"/>
  <line class="bhd" x1="140" y1="328" x2="140" y2="406"/>
  <line class="bhd" x1="240" y1="328" x2="240" y2="406"/>
  <rect class="pa" x="70" y="358" width="40" height="36"/><text x="90" y="381" class="pl">A</text>
  <rect class="pb" x="270" y="358" width="40" height="36"/><text x="290" y="381" class="pl">B</text>
  <text x="190" y="381" text-anchor="middle" class="sm">empty compartment</text>

  <!-- P4 Separated longitudinally -->
  <text x="390" y="300" class="nm">4 · SEPARATED LONGITUDINALLY</text>
  <text x="390" y="316" class="sm">Intervening compartment and hold; or ≥ 24 m</text>
  <rect class="hull" x="390" y="328" width="300" height="78"/>
  <line class="bhd" x1="490" y1="328" x2="490" y2="406"/>
  <line class="bhd" x1="590" y1="328" x2="590" y2="406"/>
  <rect class="pa" x="410" y="358" width="36" height="36"/><text x="428" y="381" class="pl">A</text>
  <rect class="pb" x="648" y="358" width="36" height="36"/><text x="666" y="381" class="pl">B</text>
  <line class="dim" x1="446" y1="416" x2="648" y2="416" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="547" y="430" text-anchor="middle" class="sm" fill="#16a34a">≥ 24 m (fore and aft)</text>

  <text x="360" y="470" text-anchor="middle" class="sm">In the table rows/columns are IMDG classes; the cell code 1/2/3/4 gives the segregation level and X means "see the special provision".</text>
</svg>
