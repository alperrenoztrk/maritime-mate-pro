<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a" font-family="Arial">Classes of Fire and Extinguishing Media</text>

  <!-- Class A -->
  <g transform="translate(100, 55)">
    <rect x="0" y="0" width="130" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="65" cy="40" r="25" fill="#dc2626"/>
    <text x="65" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="white" font-family="Arial">A</text>
    <text x="65" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a" font-family="Arial">Solids</text>
    <text x="65" y="102" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">Wood, paper,</text>
    <text x="65" y="115" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">cloth, plastic</text>
    <text x="65" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669" font-family="Arial">Water, foam</text>
  </g>

  <!-- Class B -->
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="130" height="160" rx="10" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
    <circle cx="65" cy="40" r="25" fill="#d97706"/>
    <text x="65" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="white" font-family="Arial">B</text>
    <text x="65" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a" font-family="Arial">Liquids</text>
    <text x="65" y="102" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">Petrol, oil,</text>
    <text x="65" y="115" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">paint, diesel</text>
    <text x="65" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669" font-family="Arial">Foam, DCP, CO₂</text>
  </g>

  <!-- Class C -->
  <g transform="translate(400, 55)">
    <rect x="0" y="0" width="130" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="65" cy="40" r="25" fill="#2563eb"/>
    <text x="65" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="white" font-family="Arial">C</text>
    <text x="65" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a" font-family="Arial">Gases</text>
    <text x="65" y="102" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">LPG, LNG,</text>
    <text x="65" y="115" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">methane, propane</text>
    <text x="65" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669" font-family="Arial">DCP, CO₂</text>
  </g>

  <!-- Class D -->
  <g transform="translate(550, 55)">
    <rect x="0" y="0" width="130" height="160" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="65" cy="40" r="25" fill="#7c3aed"/>
    <text x="65" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="white" font-family="Arial">D</text>
    <text x="65" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a" font-family="Arial">Metals</text>
    <text x="65" y="102" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">Magnesium,</text>
    <text x="65" y="115" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">aluminium powder</text>
    <text x="65" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669" font-family="Arial">Special DCP, sand</text>
  </g>

  <!-- Class E/F (Electrical) -->
  <g transform="translate(700, 55)">
    <rect x="0" y="0" width="130" height="160" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="65" cy="40" r="25" fill="#059669"/>
    <text x="65" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="white" font-family="Arial">E</text>
    <text x="65" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a" font-family="Arial">Electrical</text>
    <text x="65" y="102" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">Electrical equipment,</text>
    <text x="65" y="115" text-anchor="middle" font-size="9" fill="#64748b" font-family="Arial">cables, panels</text>
    <text x="65" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669" font-family="Arial">CO₂, DCP</text>
  </g>

  <!-- Fire Triangle mini -->
  <g transform="translate(450, 250)">
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a" font-family="Arial">Fire Triangle</text>
    <path d="M0 20 L60 110 L-60 110 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="55" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626" font-family="Arial">HEAT</text>
    <text x="-35" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="#d97706" font-family="Arial">FUEL</text>
    <text x="35" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="#2563eb" font-family="Arial">O₂</text>
  </g>

  <!-- Note -->
  <rect x="100" y="370" width="700" height="35" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="385" text-anchor="middle" font-size="10" fill="#0f172a" font-family="Arial">DCP: Dry Chemical Powder | CO₂: Carbon dioxide | Classification follows IMO and NFPA standards.</text>
  <text x="450" y="398" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="Arial">To extinguish a fire at least one side of the triangle is removed (cooling, smothering, starving).</text>
</svg>