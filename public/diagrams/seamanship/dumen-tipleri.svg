<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <rect width="900" height="380" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a" font-family="Arial">Dümen Tipleri Karşılaştırması</text>

  <!-- Unbalanced Rudder -->
  <g transform="translate(150, 50)">
    <text x="0" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a" font-family="Arial">Dengesiz (Unbalanced)</text>
    <!-- Rudder stock -->
    <line x1="0" y1="30" x2="0" y2="80" stroke="#3f3f46" stroke-width="4"/>
    <!-- Rudder blade -->
    <rect x="0" y="80" width="50" height="120" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Pivot point -->
    <circle cx="0" cy="80" r="5" fill="#dc2626"/>
    <text x="-15" y="65" font-size="9" fill="#dc2626" font-family="Arial">Pivot</text>
    <!-- Area label -->
    <text x="25" y="145" text-anchor="middle" font-size="9" fill="#1e3a8a" font-family="Arial">Pala</text>

    <text x="25" y="230" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">Tüm alan pivotun</text>
    <text x="25" y="244" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">arkasında</text>
    <text x="25" y="265" text-anchor="middle" font-size="10" fill="#dc2626" font-family="Arial">Yüksek tork gerektirir</text>
  </g>

  <!-- Semi-balanced Rudder -->
  <g transform="translate(450, 50)">
    <text x="0" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a" font-family="Arial">Yarı Dengeli (Semi-balanced)</text>
    <!-- Rudder stock -->
    <line x1="0" y1="30" x2="0" y2="80" stroke="#3f3f46" stroke-width="4"/>
    <!-- Rudder blade - part before and after pivot -->
    <rect x="-15" y="80" width="65" height="120" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Pivot point -->
    <circle cx="0" cy="80" r="5" fill="#dc2626"/>
    <text x="-15" y="65" font-size="9" fill="#dc2626" font-family="Arial">Pivot</text>
    <!-- Horn -->
    <rect x="-5" y="80" width="10" height="40" fill="#64748b" stroke="#3f3f46" stroke-width="1"/>
    <text x="-25" y="105" font-size="8" fill="#475569" font-family="Arial">Horn</text>

    <text x="18" y="230" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">Alanın %20-30'u</text>
    <text x="18" y="244" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">pivotun önünde</text>
    <text x="18" y="265" text-anchor="middle" font-size="10" fill="#059669" font-family="Arial">Orta tork gerektirir</text>
  </g>

  <!-- Balanced (Spade) Rudder -->
  <g transform="translate(750, 50)">
    <text x="0" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a" font-family="Arial">Dengeli (Balanced/Spade)</text>
    <!-- Rudder stock -->
    <line x1="0" y1="30" x2="0" y2="80" stroke="#3f3f46" stroke-width="4"/>
    <!-- Rudder blade -->
    <rect x="-25" y="60" width="70" height="140" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Pivot point -->
    <circle cx="0" cy="80" r="5" fill="#dc2626"/>
    <text x="-15" y="55" font-size="9" fill="#dc2626" font-family="Arial">Pivot</text>

    <text x="10" y="230" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">Alanın %30-40'ı</text>
    <text x="10" y="244" text-anchor="middle" font-size="10" fill="#475569" font-family="Arial">pivotun önünde</text>
    <text x="10" y="265" text-anchor="middle" font-size="10" fill="#059669" font-family="Arial">Düşük tork gerektirir</text>
  </g>

  <!-- Bottom note -->
  <rect x="100" y="310" width="700" height="50" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="335" text-anchor="middle" font-size="11" fill="#0f172a" font-family="Arial">Pivot noktasının önündeki alan arttıkça dümen makinesi tork ihtiyacı azalır,</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#0f172a" font-family="Arial">ancak dümenin serbest dönme (flutter) riski artar.</text>
</svg>