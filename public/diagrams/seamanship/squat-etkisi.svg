<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <rect width="900" height="380" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a" font-family="Arial">Squat Etkisi — Sığ Su Batması</text>

  <!-- Sea bottom -->
  <rect x="50" y="280" width="800" height="60" fill="#d2b48c" stroke="#a0855b" stroke-width="2"/>
  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#78350f" font-family="Arial">DENİZ TABANI</text>

  <!-- Water -->
  <rect x="50" y="120" width="800" height="160" fill="#bfdbfe" opacity="0.5"/>
  <!-- Water surface -->
  <path d="M50 120 Q100 110 150 120 Q200 130 250 120 Q300 110 350 120 Q400 130 450 120 Q500 110 550 120 Q600 130 650 120 Q700 110 750 120 Q800 130 850 120" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- Ship at normal draft (left - static) -->
  <g transform="translate(200, 0)">
    <text x="0" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">Durağan Hâl</text>
    <rect x="-60" y="140" width="120" height="40" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <path d="M-60 160 L-80 170 L-60 180" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <!-- Draft line -->
    <line x1="-60" y1="170" x2="60" y2="170" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 2"/>
    <!-- UKC arrow -->
    <line x1="70" y1="180" x2="70" y2="280" stroke="#059669" stroke-width="1.5"/>
    <path d="M66 185 L70 180 L74 185" fill="none" stroke="#059669" stroke-width="1.5"/>
    <path d="M66 275 L70 280 L74 275" fill="none" stroke="#059669" stroke-width="1.5"/>
    <text x="85" y="235" font-size="10" fill="#059669" font-family="Arial">UKC</text>
  </g>

  <!-- Ship at squat (right - moving) -->
  <g transform="translate(650, 0)">
    <text x="0" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a" font-family="Arial">Hızla Seyrederken</text>
    <rect x="-60" y="155" width="120" height="40" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <path d="M-60 175 L-80 185 L-60 195" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <!-- Squat arrow -->
    <line x1="-80" y1="170" x2="-80" y2="195" stroke="#dc2626" stroke-width="2"/>
    <path d="M-84 190 L-80 195 L-76 190" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text x="-100" y="185" font-size="10" font-weight="bold" fill="#dc2626" font-family="Arial" text-anchor="end">Squat</text>
    <!-- Reduced UKC -->
    <line x1="70" y1="195" x2="70" y2="280" stroke="#dc2626" stroke-width="1.5"/>
    <path d="M66 200 L70 195 L74 200" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <path d="M66 275 L70 280 L74 275" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text x="85" y="240" font-size="10" fill="#dc2626" font-family="Arial">UKC↓</text>
    <!-- Speed arrow -->
    <line x1="60" y1="160" x2="90" y2="160" stroke="#0f172a" stroke-width="2"/>
    <path d="M85 156 L90 160 L85 164" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <text x="95" y="164" font-size="9" fill="#0f172a" font-family="Arial">V</text>
    <!-- Low pressure zone -->
    <ellipse cx="0" cy="210" rx="55" ry="15" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="0" y="214" text-anchor="middle" font-size="8" fill="#dc2626" font-family="Arial">Düşük basınç bölgesi</text>
  </g>

  <!-- Formula box -->
  <rect x="250" y="320" width="400" height="45" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="450" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e" font-family="Arial">Squat ≈ Cb × V² / 100  (açık deniz)</text>
  <text x="450" y="357" text-anchor="middle" font-size="10" fill="#78350f" font-family="Arial">Cb: blok katsayısı, V: hız (knot), Sonuç: metre</text>
</svg>