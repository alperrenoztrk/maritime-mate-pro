<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a" font-family="Arial">Parts of a Ship — Side View</text>

  <!-- Hull -->
  <path d="M120 250 Q120 300 200 310 L700 310 Q780 300 780 250 L780 200 L120 200 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <!-- Deck -->
  <rect x="120" y="190" width="660" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <!-- Bow shape -->
  <path d="M120 200 Q80 220 100 260 Q110 290 200 310" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <!-- Bulbous bow -->
  <ellipse cx="95" cy="275" rx="20" ry="12" fill="#93c5fd" stroke="#475569" stroke-width="1.5"/>

  <!-- Superstructure -->
  <rect x="520" y="130" width="180" height="62" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="540" y="100" width="140" height="32" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <!-- Bridge windows -->
  <rect x="548" y="107" width="18" height="12" rx="2" fill="#7dd3fc"/>
  <rect x="572" y="107" width="18" height="12" rx="2" fill="#7dd3fc"/>
  <rect x="596" y="107" width="18" height="12" rx="2" fill="#7dd3fc"/>
  <rect x="620" y="107" width="18" height="12" rx="2" fill="#7dd3fc"/>
  <rect x="644" y="107" width="18" height="12" rx="2" fill="#7dd3fc"/>

  <!-- Funnel -->
  <rect x="640" y="60" width="40" height="42" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Mast -->
  <line x1="300" y1="90" x2="300" y2="190" stroke="#475569" stroke-width="3"/>
  <line x1="280" y1="110" x2="320" y2="110" stroke="#475569" stroke-width="2"/>

  <!-- Waterline -->
  <line x1="60" y1="280" x2="840" y2="280" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="850" y="284" font-size="11" fill="#2563eb" font-family="Arial">Waterline</text>

  <!-- Keel line -->
  <line x1="100" y1="310" x2="780" y2="310" stroke="#0f172a" stroke-width="2"/>

  <!-- Labels with leader lines -->
  <!-- Pruva -->
  <line x1="100" y1="240" x2="50" y2="180" stroke="#dc2626" stroke-width="1"/>
  <circle cx="100" cy="240" r="3" fill="#dc2626"/>
  <text x="15" y="175" font-size="12" font-weight="bold" fill="#dc2626" font-family="Arial">BOW</text>
  <text x="15" y="188" font-size="10" fill="#64748b" font-family="Arial">(stem)</text>

  <!-- Kıç -->
  <line x1="760" y1="240" x2="820" y2="180" stroke="#dc2626" stroke-width="1"/>
  <circle cx="760" cy="240" r="3" fill="#dc2626"/>
  <text x="800" y="175" font-size="12" font-weight="bold" fill="#dc2626" font-family="Arial">STERN</text>
  <text x="800" y="188" font-size="10" fill="#64748b" font-family="Arial">(aft)</text>

  <!-- Köprüüstü -->
  <line x1="610" y1="110" x2="660" y2="70" stroke="#0369a1" stroke-width="1"/>
  <circle cx="610" cy="110" r="3" fill="#0369a1"/>
  <text x="665" y="65" font-size="11" font-weight="bold" fill="#0369a1" font-family="Arial">Bridge</text>
  <text x="665" y="78" font-size="9" fill="#64748b" font-family="Arial">(wheelhouse)</text>

  <!-- Omurga -->
  <line x1="450" y1="310" x2="450" y2="345" stroke="#7c3aed" stroke-width="1"/>
  <circle cx="450" cy="310" r="3" fill="#7c3aed"/>
  <text x="420" y="360" font-size="11" font-weight="bold" fill="#7c3aed" font-family="Arial">Keel</text>

  <!-- Güverte -->
  <line x1="350" y1="195" x2="350" y2="160" stroke="#059669" stroke-width="1"/>
  <circle cx="350" cy="195" r="3" fill="#059669"/>
  <text x="320" y="155" font-size="11" font-weight="bold" fill="#059669" font-family="Arial">Main Deck</text>
  <text x="320" y="168" font-size="9" fill="#64748b" font-family="Arial">(weather deck)</text>

  <!-- Borda -->
  <line x1="250" y1="250" x2="200" y2="340" stroke="#b45309" stroke-width="1"/>
  <circle cx="250" cy="250" r="3" fill="#b45309"/>
  <text x="155" y="355" font-size="11" font-weight="bold" fill="#b45309" font-family="Arial">Hull</text>

  <!-- Ampul Pruva -->
  <line x1="95" y1="275" x2="50" y2="330" stroke="#0284c7" stroke-width="1"/>
  <circle cx="95" cy="275" r="3" fill="#0284c7"/>
  <text x="10" y="345" font-size="10" font-weight="bold" fill="#0284c7" font-family="Arial">Bulbous Bow</text>

  <!-- Kasara -->
  <line x1="180" y1="190" x2="150" y2="140" stroke="#059669" stroke-width="1"/>
  <circle cx="180" cy="190" r="3" fill="#059669"/>
  <text x="105" y="135" font-size="11" font-weight="bold" fill="#059669" font-family="Arial">Forecastle</text>
  <text x="105" y="148" font-size="9" fill="#64748b" font-family="Arial">(fo'c'sle)</text>

  <!-- Ambar -->
  <rect x="340" y="200" width="80" height="40" fill="#fbbf24" opacity="0.3" stroke="#b45309" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="355" y="225" font-size="9" fill="#b45309" font-family="Arial">Cargo Hold</text>

  <!-- Draft arrow -->
  <line x1="820" y1="280" x2="820" y2="310" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M815 285 L820 280 L825 285" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M815 305 L820 310 L825 305" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="830" y="300" font-size="10" fill="#7c3aed" font-family="Arial">Draft</text>

  <!-- Freeboard arrow -->
  <line x1="810" y1="195" x2="810" y2="280" stroke="#059669" stroke-width="1.5"/>
  <path d="M805 200 L810 195 L815 200" fill="none" stroke="#059669" stroke-width="1.5"/>
  <path d="M805 275 L810 280 L815 275" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="815" y="240" font-size="10" fill="#059669" font-family="Arial" transform="rotate(90 815 240)">Freeboard</text>
</svg>