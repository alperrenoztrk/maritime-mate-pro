<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .nm{font:12.5px sans-serif;fill:#0f172a;font-weight:700}
      .sm{font:10.5px sans-serif;fill:#475569}
      .chain{stroke:#b45309;stroke-width:2}
      .line{stroke:#0f172a;stroke-width:1.5}
      .swing{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 4}
      .quay{fill:#d6c19a;stroke:#0f172a;stroke-width:1.5}
    </style>
    <g id="anc">
      <circle cx="0" cy="0" r="3.5" fill="none" stroke="#0f172a" stroke-width="2"/>
      <line x1="0" y1="3" x2="0" y2="17" stroke="#0f172a" stroke-width="2"/>
      <line x1="-6" y1="6" x2="6" y2="6" stroke="#0f172a" stroke-width="2"/>
      <path d="M -8 11 Q 0 21 8 11" fill="none" stroke="#0f172a" stroke-width="2"/>
    </g>
    <g id="ship"><path d="M0,-22 L9,-7 L9,20 L-9,20 L-9,-7 Z" fill="#1e3a8a"/></g>
  </defs>
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">Anchoring Techniques (plan view)</text>

  <!-- P1 single -->
  <text x="40" y="70" class="nm">Single anchor (swinging moor)</text>
  <circle class="swing" cx="195" cy="165" r="56"/>
  <use xlink:href="#anc" x="195" y="96"/>
  <line class="chain" x1="195" y1="146" x2="195" y2="100"/>
  <use xlink:href="#ship" transform="translate(195 168)"/>
  <text x="195" y="244" text-anchor="middle" class="sm">one anchor · large swinging circle</text>

  <!-- P2 two-anchor -->
  <text x="380" y="70" class="nm">Two anchors (running / standing moor)</text>
  <use xlink:href="#anc" x="535" y="92"/>
  <use xlink:href="#anc" x="535" y="226"/>
  <line class="chain" x1="535" y1="142" x2="535" y2="96"/>
  <line class="chain" x1="535" y1="190" x2="535" y2="222"/>
  <use xlink:href="#ship" transform="translate(535 165)"/>
  <text x="535" y="252" text-anchor="middle" class="sm">swing restricted · strong hold</text>

  <!-- P3 mediterranean -->
  <text x="40" y="296" class="nm">Mediterranean moor</text>
  <rect class="quay" x="90" y="300" width="210" height="14"/>
  <text x="195" y="311" text-anchor="middle" class="sm" fill="#0f172a">QUAY</text>
  <use xlink:href="#ship" transform="translate(195 360) rotate(180)"/>
  <line class="line" x1="186" y1="340" x2="120" y2="314"/>
  <line class="line" x1="204" y1="340" x2="270" y2="314"/>
  <use xlink:href="#anc" x="120" y="440"/>
  <use xlink:href="#anc" x="270" y="440"/>
  <line class="chain" x1="190" y1="382" x2="122" y2="438"/>
  <line class="chain" x1="200" y1="382" x2="268" y2="438"/>
  <text x="195" y="464" text-anchor="middle" class="sm">stern to the quay · two anchors out forward</text>

  <!-- P4 open moor -->
  <text x="380" y="296" class="nm">Open moor</text>
  <use xlink:href="#anc" x="470" y="316"/>
  <use xlink:href="#anc" x="600" y="316"/>
  <line class="chain" x1="528" y1="362" x2="472" y2="322"/>
  <line class="chain" x1="542" y1="362" x2="598" y2="322"/>
  <use xlink:href="#ship" transform="translate(535 380)"/>
  <text x="535" y="462" text-anchor="middle" class="sm">two anchors at 60-90° · holds through a change of pull</text>
</svg>
