<svg width="720" height="450" viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ttl{font:18px sans-serif;fill:#0f172a;font-weight:700}
      .hd{font:13px sans-serif;fill:#0f172a;font-weight:700}
      .it{font:12px sans-serif;fill:#0f172a}
      .sm{font:11px sans-serif;fill:#475569}
      .num{font:13px sans-serif;fill:#ffffff;font-weight:700}
    </style>
  </defs>
  <rect width="720" height="450" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" class="ttl">Enclosed Space Entry — Order of Work</text>

  <g transform="translate(20 44)">
    <rect width="440" height="386" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="28" class="hd">No step may be skipped or taken out of order</text>

    <g transform="translate(18 44)">
      <circle cx="14" cy="14" r="14" fill="#0369a1"/><text x="14" y="19" text-anchor="middle" class="num">1</text>
      <text x="42" y="12" class="it">Risk assessment and permit to work</text>
      <text x="42" y="30" class="sm">Authorised by the master; valid for a stated period only.</text>
    </g>

    <g transform="translate(18 100)">
      <circle cx="14" cy="14" r="14" fill="#0369a1"/><text x="14" y="19" text-anchor="middle" class="num">2</text>
      <text x="42" y="12" class="it">Isolate and secure</text>
      <text x="42" y="30" class="sm">Blank off lines, lock out power, tag the valves and switches.</text>
    </g>

    <g transform="translate(18 156)">
      <circle cx="14" cy="14" r="14" fill="#0369a1"/><text x="14" y="19" text-anchor="middle" class="num">3</text>
      <text x="42" y="12" class="it">Ventilate before entry, and throughout</text>
      <text x="42" y="30" class="sm">Ventilation continues while anyone remains inside.</text>
    </g>

    <g transform="translate(18 212)">
      <circle cx="14" cy="14" r="14" fill="#b91c1c"/><text x="14" y="19" text-anchor="middle" class="num">4</text>
      <text x="42" y="12" class="it">Test the atmosphere — from outside</text>
      <text x="42" y="30" class="sm">Test at several depths. Never test by entering the space.</text>
    </g>

    <g transform="translate(18 268)">
      <circle cx="14" cy="14" r="14" fill="#0369a1"/><text x="14" y="19" text-anchor="middle" class="num">5</text>
      <text x="42" y="12" class="it">Standby person and communication</text>
      <text x="42" y="30" class="sm">A trained attendant stays at the opening, in constant contact.</text>
    </g>

    <g transform="translate(18 324)">
      <circle cx="14" cy="14" r="14" fill="#0369a1"/><text x="14" y="19" text-anchor="middle" class="num">6</text>
      <text x="42" y="12" class="it">Rescue equipment ready at the entrance</text>
      <text x="42" y="30" class="sm">Breathing apparatus, harness, lifeline and resuscitator.</text>
    </g>
  </g>

  <!-- atmosphere limits -->
  <g transform="translate(476 44)">
    <rect width="224" height="386" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="18" y="28" class="hd" style="fill:#b91c1c">Entry criteria</text>

    <text x="18" y="60" class="it">Oxygen</text>
    <text x="18" y="80" class="sm">20.9 % by volume — a normal</text>
    <text x="18" y="96" class="sm">reading, not merely a safe one.</text>

    <text x="18" y="128" class="it">Flammable gas</text>
    <text x="18" y="148" class="sm">Not more than 1 % of the lower</text>
    <text x="18" y="164" class="sm">flammable limit (LFL).</text>

    <text x="18" y="196" class="it">Toxic gas</text>
    <text x="18" y="216" class="sm">Below the occupational exposure</text>
    <text x="18" y="232" class="sm">limit for the substance concerned.</text>

    <path d="M18,256 H206" stroke="#fecaca" stroke-width="1"/>

    <text x="18" y="284" class="it" style="fill:#b91c1c">If in doubt, do not enter</text>
    <text x="18" y="308" class="sm">Most enclosed space deaths are</text>
    <text x="18" y="324" class="sm">would-be rescuers who entered</text>
    <text x="18" y="340" class="sm">without breathing apparatus.</text>
    <text x="18" y="364" class="sm">Raise the alarm first; never enter</text>
    <text x="18" y="380" class="sm">to attempt a rescue unprotected.</text>
  </g>
</svg>
