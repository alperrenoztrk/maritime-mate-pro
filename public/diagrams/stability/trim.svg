<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#f8fafc" />
  <text x="450" y="34" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Trim: Baş ve Kıç Draft Farkı</text>

  <!-- su -->
  <rect x="60" y="190" width="780" height="130" fill="#dbeafe" />
  <line x1="60" y1="190" x2="840" y2="190" stroke="#1e3a8a" stroke-width="2" />
  <text x="70" y="182" font-size="12" font-family="Arial" fill="#1e3a8a">Su hattı</text>

  <!-- gemi yan görünüşü, kıça trimli (kıç daha derin) -->
  <g transform="rotate(-3 450 220)">
    <path d="M200 160 L640 160 L640 130 L700 130 L700 160 L720 160 Q740 200 700 240 L240 240 Q200 220 200 160 Z"
          fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- baş draft -->
  <line x1="230" y1="190" x2="230" y2="252" stroke="#0ea5e9" stroke-width="2.5" />
  <path d="M230 252 L223 240 L237 240 Z" fill="#0ea5e9" />
  <text x="176" y="230" font-size="13" font-weight="bold" font-family="Arial" fill="#0ea5e9">dbaş</text>

  <!-- kıç draft (daha büyük) -->
  <line x1="700" y1="190" x2="700" y2="272" stroke="#ef4444" stroke-width="2.5" />
  <path d="M700 272 L693 260 L707 260 Z" fill="#ef4444" />
  <text x="712" y="240" font-size="13" font-weight="bold" font-family="Arial" fill="#ef4444">dkıç</text>

  <!-- yön etiketleri -->
  <text x="205" y="140" font-size="13" font-family="Arial" fill="#475569">BAŞ (FWD)</text>
  <text x="660" y="110" font-size="13" font-family="Arial" fill="#475569">KIÇ (AFT)</text>

  <text x="60" y="340" font-size="12" font-family="Arial" fill="#64748b">Trim = dkıç − dbaş. Pozitif değer kıça trim (şekildeki durum), negatif değer başa trim demektir.</text>
</svg>
