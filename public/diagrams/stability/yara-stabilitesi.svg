<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#f8fafc" />
  <text x="450" y="34" text-anchor="middle" font-size="22" font-family="Arial" fill="#0f172a">Hasar (Yara) Stabilitesi: Bölme Su Alması ve List</text>

  <!-- su -->
  <rect x="60" y="200" width="780" height="120" fill="#dbeafe" />
  <line x1="60" y1="200" x2="840" y2="200" stroke="#1e3a8a" stroke-width="2" />

  <!-- yatmış (listli) gemi kesiti -->
  <g transform="rotate(8 450 220)">
    <path d="M280 130 L620 130 L610 260 Q450 305 290 260 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <!-- bölme perdeleri -->
    <line x1="390" y1="130" x2="390" y2="272" stroke="#475569" stroke-width="2" />
    <line x1="510" y1="130" x2="510" y2="272" stroke="#475569" stroke-width="2" />
    <!-- hasarlı bölmede su -->
    <path d="M290 205 L390 205 L390 268 Q330 280 295 262 Z" fill="#60a5fa" />
    <!-- yara -->
    <path d="M287 225 L302 232 L289 242 L305 250" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="250" y="120" font-size="13" font-weight="bold" font-family="Arial" fill="#ef4444">Yara (su girişi)</text>
  <line x1="292" y1="126" x2="308" y2="212" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" />

  <text x="560" y="100" font-size="13" font-family="Arial" fill="#475569">Su geçirmez perdeler</text>
  <line x1="580" y1="106" x2="522" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- list oku -->
  <path d="M700 90 A 60 60 0 0 1 760 140" fill="none" stroke="#7c3aed" stroke-width="3" />
  <path d="M760 140 L746 132 L752 120 Z" fill="#7c3aed" />
  <text x="700" y="80" font-size="13" font-weight="bold" font-family="Arial" fill="#7c3aed">List</text>

  <text x="60" y="340" font-size="12" font-family="Arial" fill="#64748b">Hasarlı bölmeye giren su geminin liste yatmasına yol açar; perdeler su yayılımını sınırlar (geçirgenlik μ).</text>
</svg>
