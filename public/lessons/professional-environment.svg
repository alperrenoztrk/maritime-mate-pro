<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-labelledby="title desc"><title id="title">Bilge-discharge decision</title><desc id="desc">Identify source: Oil / machinery bilge then Check conditions: Area + vessel rules then Verify equipment: OWS + alarm + valve then Record / retain: ORB or reception; A reading below 15 ppm alone never authorises discharge.</desc><rect width="680" height="700" rx="18" fill="#ffffff"/><text x="340" y="46" font-family="Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="bold" fill="#11364e">Bilge-discharge decision</text><rect x="70" y="80" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Identify source</text><text x="340" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Oil / machinery bilge</text><path d="M340 185 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 199 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="209" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Check conditions</text><text x="340" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Area + vessel rules</text><path d="M340 314 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 328 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="338" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Verify equipment</text><text x="340" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">OWS + alarm + valve</text><path d="M340 443 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 457 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="467" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Record / retain</text><text x="340" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">ORB or reception</text><text x="340" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">A reading below 15 ppm alone never authorises discharge.</text></svg>
