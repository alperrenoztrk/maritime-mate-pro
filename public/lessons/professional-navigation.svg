<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-labelledby="title desc"><title id="title">Collision-risk decision chain</title><desc id="desc">Observe: Visual lookout + radar then Assess: Bearing trend and range then Decide: COLREG 7/8/15/16 then Verify: Pass clear; reassess; A single AIS CPA value is not a substitute for a full risk assessment.</desc><rect width="680" height="700" rx="18" fill="#ffffff"/><text x="340" y="46" font-family="Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="bold" fill="#11364e">Collision-risk decision chain</text><rect x="70" y="80" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Observe</text><text x="340" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Visual lookout + radar</text><path d="M340 185 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 199 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="209" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Assess</text><text x="340" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Bearing trend and range</text><path d="M340 314 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 328 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="338" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Decide</text><text x="340" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">COLREG 7/8/15/16</text><path d="M340 443 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 457 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="467" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Verify</text><text x="340" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Pass clear; reassess</text><text x="340" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">A single AIS CPA value is not a substitute for a full risk</text><text x="340" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">assessment.</text></svg>
