<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-labelledby="title desc"><title id="title">Deck cargo restraint workflow</title><desc id="desc">Estimate loads: m × transverse a then Check geometry: Lashing angles + friction then Verify strength: MSL / securing points then Inspect in service: Retension / damage; Follow the ship's Cargo Securing Manual; force alone does not determine lashing count.</desc><rect width="680" height="700" rx="18" fill="#ffffff"/><text x="340" y="46" font-family="Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="bold" fill="#11364e">Deck cargo restraint workflow</text><rect x="70" y="80" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Estimate loads</text><text x="340" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">m × transverse a</text><path d="M340 185 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 199 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="209" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Check geometry</text><text x="340" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Lashing angles + friction</text><path d="M340 314 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 328 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="338" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Verify strength</text><text x="340" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">MSL / securing points</text><path d="M340 443 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 457 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="467" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Inspect in service</text><text x="340" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Retension / damage</text><text x="340" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">Follow the ship's Cargo Securing Manual; force alone does not</text><text x="340" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">determine lashing count.</text></svg>
