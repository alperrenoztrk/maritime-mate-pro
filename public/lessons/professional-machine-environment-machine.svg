 + stop device</text><path d="M340 443 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 457 l11 12 l11 -12" stroke="#2786ac" stroke-width="4" fill="none"/><rect x="70" y="467" width="540" height="105" rx="15" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Decision</text><text x="340" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Retain or lawful discharge</text><text x="340" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">Monitor value does not override legal restrictions.</text></svg>
