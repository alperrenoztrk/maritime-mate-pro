<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 375" role="img" aria-labelledby="title desc"><title id="title">EPIRB, radar SART, AIS EPIRB display comparison</title><desc id="desc">Standard EPIRB shows no twelve radar dots; radar-SART shows twelve X-band radar dots; AIS EPIRB appears as an AIS target.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .h{font-size:22px;font-weight:bold;fill:#12304a}.b{font-size:15px;font-weight:bold;fill:#12304a}.s{font-size:13px;fill:#34516a}.card{fill:#eef6fb;stroke:#88b2ce;stroke-width:2}.arrow{stroke:#2581ab;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2581ab"/></marker></defs><rect width="1040" height="375" rx="16" fill="white"/><text x="28" y="42" class="h">Do EPIRBs appear on radar?</text><rect x="22" y="66" width="315" height="274" rx="14" class="card"/><text x="179" y="97" text-anchor="middle" class="b">406 MHz EPIRB</text><circle cx="180" cy="205" r="82" fill="#16354a" stroke="#719eb7" stroke-width="2"/><circle cx="180" cy="205" r="57" fill="none" stroke="#416475"/><path d="M180 123V287M98 205H262" stroke="#416475"/><text x="180" y="208" text-anchor="middle" font-size="12" fill="white">No 12-dot trace</text><text x="180" y="322" text-anchor="middle" class="s">Satellite alert; not radar-SART</text><rect x="362" y="66" width="315" height="274" rx="14" class="card"/><text x="519" y="97" text-anchor="middle" class="b">9 GHz radar-SART</text><circle cx="520" cy="205" r="82" fill="#16354a" stroke="#719eb7" stroke-width="2"/><circle cx="520" cy="205" r="57" fill="none" stroke="#416475"/><path d="M520 123V287M438 205H602" stroke="#416475"/><circle cx="469" cy="200" r="3.4" fill="#ffd06b"/><circle cx="478" cy="201.2" r="3.4" fill="#ffd06b"/><circle cx="487" cy="202.4" r="3.4" fill="#ffd06b"/><circle cx="496" cy="203.6" r="3.4" fill="#ffd06b"/><circle cx="505" cy="204.8" r="3.4" fill="#ffd06b"/><circle cx="514" cy="206" r="3.4" fill="#ffd06b"/><circle cx="523" cy="207.2" r="3.4" fill="#ffd06b"/><circle cx="532" cy="208.4" r="3.4" fill="#ffd06b"/><circle cx="541" cy="209.6" r="3.4" fill="#ffd06b"/><circle cx="550" cy="210.8" r="3.4" fill="#ffd06b"/><circle cx="559" cy="212" r="3.4" fill="#ffd06b"/><circle cx="568" cy="213.2" r="3.4" fill="#ffd06b"/><text x="520" y="322" text-anchor="middle" class="s">12 dots / arcs on X-band</text><rect x="702" y="66" width="315" height="274" rx="14" class="card"/><text x="859" y="97" text-anchor="middle" class="b">AIS EPIRB</text><circle cx="860" cy="205" r="82" fill="#16354a" stroke="#719eb7" stroke-width="2"/><circle cx="860" cy="205" r="57" fill="none" stroke="#416475"/><path d="M860 123V287M778 205H942" stroke="#416475"/><circle cx="860" cy="205" r="25" fill="none" stroke="#ffc85e" stroke-width="3"/><path d="M845 190L875 220M875 190L845 220" stroke="#ff7979" stroke-width="4"/><text x="860" y="322" text-anchor="middle" class="s">AIS target, if equipped</text></svg>