<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 335" role="img" aria-labelledby="title desc"><title id="title">How an EPIRB sends an alert</title><desc id="desc">406 MHz EPIRB alert is relayed to Cospas-Sarsat satellites, LUT, MCC, RCC and then SAR resources. 121.5 MHz is local homing.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .h{font-size:22px;font-weight:bold;fill:#12304a}.b{font-size:15px;font-weight:bold;fill:#12304a}.s{font-size:13px;fill:#34516a}.card{fill:#eef6fb;stroke:#88b2ce;stroke-width:2}.arrow{stroke:#2581ab;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2581ab"/></marker></defs><rect width="1060" height="335" rx="16" fill="white"/><text x="30" y="43" class="h">406 MHz distress alert: where does the signal go?</text><rect x="24" y="103" width="148" height="99" rx="12" class="card"/><text x="98" y="144" text-anchor="middle" class="b">EPIRB</text><text x="98" y="168" text-anchor="middle" class="s">406 MHz + ID</text><path d="M172 153H195" class="arrow"/><rect x="198" y="103" width="148" height="99" rx="12" class="card"/><text x="272" y="144" text-anchor="middle" class="b">Satellites</text><text x="272" y="168" text-anchor="middle" class="s">Cospas-Sarsat</text><path d="M346 153H369" class="arrow"/><rect x="372" y="103" width="148" height="99" rx="12" class="card"/><text x="446" y="144" text-anchor="middle" class="b">LUT</text><text x="446" y="168" text-anchor="middle" class="s">ground terminal</text><path d="M520 153H543" class="arrow"/><rect x="546" y="103" width="148" height="99" rx="12" class="card"/><text x="620" y="144" text-anchor="middle" class="b">MCC</text><text x="620" y="168" text-anchor="middle" class="s">mission control</text><path d="M694 153H717" class="arrow"/><rect x="720" y="103" width="148" height="99" rx="12" class="card"/><text x="794" y="144" text-anchor="middle" class="b">RCC / MRCC</text><text x="794" y="168" text-anchor="middle" class="s">coordination</text><path d="M868 153H891" class="arrow"/><rect x="894" y="103" width="148" height="99" rx="12" class="card"/><text x="968" y="144" text-anchor="middle" class="b">SAR units</text><text x="968" y="168" text-anchor="middle" class="s">ship / aircraft</text><rect x="27" y="247" width="1006" height="58" rx="12" fill="#fff5e5" stroke="#e4b66a"/><text x="45" y="270" class="b">121.5 MHz homing is separate:</text><text x="45" y="291" class="s">Local search aircraft / equipped rescue units home to the beacon. It is not the Cospas-Sarsat satellite alert channel.</text></svg>