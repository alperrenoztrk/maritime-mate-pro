<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 335" role="img" aria-labelledby="title desc"><title id="title">Float-free EPIRB automatic activation</title><desc id="desc">Mechanical hydrostatic release at around 1 to 4 meters, water sensor activation, buoyant upright transmission using pre-installed battery.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .h{font-size:22px;font-weight:bold;fill:#12304a}.b{font-size:15px;font-weight:bold;fill:#12304a}.s{font-size:13px;fill:#34516a}.card{fill:#eef6fb;stroke:#88b2ce;stroke-width:2}.arrow{stroke:#2581ab;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2581ab"/></marker></defs><rect width="1040" height="335" rx="16" fill="white"/><text x="29" y="44" class="h">Float-free EPIRB: mechanical release vs electronic activation</text><rect x="24" y="91" width="220" height="156" rx="12" class="card"/><text x="134" y="131" text-anchor="middle" class="b">1. Mounted</text><text x="134" y="167" text-anchor="middle" class="s">Bracket armed</text><text x="134" y="188" text-anchor="middle" class="s">Unobstructed</text><path d="M244 163H275" class="arrow"/><rect x="280" y="91" width="220" height="156" rx="12" class="card"/><text x="390" y="131" text-anchor="middle" class="b">2. HRU releases</text><text x="390" y="167" text-anchor="middle" class="s">Water pressure ~1-4 m</text><text x="390" y="188" text-anchor="middle" class="s">Mechanical separation</text><path d="M500 163H531" class="arrow"/><rect x="536" y="91" width="220" height="156" rx="12" class="card"/><text x="646" y="131" text-anchor="middle" class="b">3. Water sensor</text><text x="646" y="167" text-anchor="middle" class="s">Sensor triggers switch</text><text x="646" y="188" text-anchor="middle" class="s">Battery already installed</text><path d="M756 163H787" class="arrow"/><rect x="792" y="91" width="220" height="156" rx="12" class="card"/><text x="902" y="131" text-anchor="middle" class="b">4. Transmits</text><text x="902" y="167" text-anchor="middle" class="s">406 + 121.5 MHz</text><text x="902" y="188" text-anchor="middle" class="s">Beacon floats upright</text><rect x="24" y="270" width="992" height="43" rx="10" fill="#fff5e5" stroke="#e4b66a"/><text x="43" y="297" class="s">The battery is not activated or charged by seawater. Always follow the beacon model manual and its approved mounting instructions.</text></svg>