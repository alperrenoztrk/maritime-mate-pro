<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-labelledby="title desc"><title id="title">Power-frequency control</title><desc id="desc">Real-power load: Increases then Prime mover: Governor response then Frequency: Speed-related then Voltage: AVR / reactive power; Speed/frequency and voltage control are related but distinct.</desc><rect width="680" height="700" rx="18" fill="#fff"/><text x="340" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#12364b">Power-frequency control</text><rect x="70" y="80" width="540" height="105" rx="15" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Real-power load</text><text x="340" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Increases</text><path d="M340 185 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 199 l11 12 l11 -12" stroke="#2786ac" stroke-width="4" fill="none"/><rect x="70" y="209" width="540" height="105" rx="15" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Prime mover</text><text x="340" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Governor response</text><path d="M340 314 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 328 l11 12 l11 -12" stroke="#2786ac" stroke-width="4" fill="none"/><rect x="70" y="338" width="540" height="105" rx="15" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Frequency</text><text x="340" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Speed-related</text><path d="M340 443 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 457 l11 12 l11 -12" stroke="#2786ac" stroke-width="4" fill="none"/><rect x="70" y="467" width="540" height="105" rx="15" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Voltage</text><text x="340" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">AVR / reactive power</text><text x="340" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">Speed/frequency and voltage control are related but distinct.</text></svg>
