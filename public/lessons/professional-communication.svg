<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-labelledby="title desc"><title id="title">VHF DSC distress chain</title><desc id="desc">Recognise: Distress and position then Alert: DSC Channel 70 then Coordinate: MAYDAY on Channel 16 then Continue: Acknowledge / log; Use the approved equipment procedure. Never send a live alert for practice.</desc><rect width="680" height="700" rx="18" fill="#ffffff"/><text x="340" y="46" font-family="Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="bold" fill="#11364e">VHF DSC distress chain</text><rect x="70" y="80" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Recognise</text><text x="340" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Distress and position</text><path d="M340 185 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 199 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="209" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Alert</text><text x="340" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">DSC Channel 70</text><path d="M340 314 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 328 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="338" width="540" height="105" rx="16" fill="#f5f9fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Coordinate</text><text x="340" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">MAYDAY on Channel 16</text><path d="M340 443 v24" stroke="#2786ac" stroke-width="4"/><path d="M329 457 l11 12 l11 -12" stroke="#2786ac" fill="none" stroke-width="4"/><rect x="70" y="467" width="540" height="105" rx="16" fill="#ebf7fc" stroke="#83adc5" stroke-width="2"/><text x="340" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12364b">Continue</text><text x="340" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#31576d">Acknowledge / log</text><text x="340" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">Use the approved equipment procedure. Never send a live alert</text><text x="340" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#684e21">for practice.</text></svg>
