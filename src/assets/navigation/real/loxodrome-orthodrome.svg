}
.angle{stroke-width: 2px; stroke: red; fill: none;}
.angletext{font-family: serif; font-size: 22px; fill: red;}
.dotshadow{font-family: sans-serif; font-size: 25px; stroke-width: 4px; stroke: #fff;}
.dot{font-family: sans-serif; font-size: 25px; fill: #000;}
</style>
<polyline points="0 0 -1 -3 0 -2 1 -3 0 0" id="arrow" style="fill: #ccc; stroke-width: 0.2px; stroke: #000;" />
