<path d="M 50 254 C 45 110 200 30 295 35" />
<path d="M 390 254 C 395 110 240 30 145 35" />

<path d="M 120 273 C 118 130 215 30 262 24" />
<path d="M 320 273 C 322 130 225 30 178 24" />

