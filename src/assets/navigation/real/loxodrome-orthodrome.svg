<text x="340" y="90" class="dotshadow">B</text>
<text x="340" y="90" class="dot">B</text>
<text x="190" y="44" class="dotshadow">N</text>
<text x="190" y="44" class="dot">N</text>

<ellipse cx="188" cy="120" rx="4" ry="6" transform="rotate(30)" style="fill:#ff0; stroke-width: 1px; stroke: black;" />
<ellipse cx="40" cy="336" rx="4" ry="6" transform="rotate(-70)" style="fill:#ff0; stroke-width: 1px; stroke: black;" />
