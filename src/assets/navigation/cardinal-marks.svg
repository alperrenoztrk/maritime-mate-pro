<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .buoy { fill: none; stroke: #000; stroke-width: 2; }
      .red { fill: #ff0000; }
      .green { fill: #00ff00; }
      .black { fill: #000000; }
      .white { fill: #ffffff; }
      .yellow { fill: #ffff00; }
      .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-size: 18px; font-weight: bold; }
      .cone { fill: #000; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="text title">Cardinal Marks - Topmarks and Colours</text>
  
  <!-- North Cardinal -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="40" class="buoy"/>
    <rect x="-25" y="-25" width="50" height="50" class="yellow"/>
    <rect x="-25" y="0" width="50" height="25" class="black"/>
    <!-- Two cones pointing up -->
    <polygon points="-10,-35 -5,-45 0,-35" class="cone"/>
    <polygon points="0,-35 5,-45 10,-35" class="cone"/>
    <text x="0" y="90" class="text">NORTH</text>
    <text x="0" y="105" class="text">Both cones up</text>
    <text x="0" y="120" class="text">Yellow over black</text>
  </g>
  
  <!-- East Cardinal -->
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="40" class="buoy"/>
    <rect x="-25" y="-25" width="25" height="50" class="black"/>
    <rect x="0" y="-25" width="25" height="50" class="yellow"/>
    <!-- Two cones pointing outward -->
    <polygon points="-15,-20 -25,-30 -15,-10" class="cone"/>
    <polygon points="15,-20 25,-30 15,-10" class="cone"/>
    <text x="0" y="90" class="text">EAST</text>
    <text x="0" y="105" class="text">Cones point away</text>
    <text x="0" y="120" class="text">Black over yellow</text>
  </g>
  
  <!-- South Cardinal -->
  <g transform="translate(500, 100)">
    <circle cx="0" cy="0" r="40" class="buoy"/>
    <rect x="-25" y="-25" width="50" height="50" class="yellow"/>
    <rect x="-25" y="-25" width="50" height="25" class="black"/>
    <!-- Two cones pointing down -->
    <polygon points="-10,35 -5,45 0,35" class="cone"/>
    <polygon points="0,35 5,45 10,35" class="cone"/>
    <text x="0" y="90" class="text">SOUTH</text>
    <text x="0" y="105" class="text">Both cones down</text>
    <text x="0" y="120" class="text">Yellow over black</text>
  </g>
  
  <!-- West Cardinal -->
  <g transform="translate(700, 100)">
    <circle cx="0" cy="0" r="40" class="buoy"/>
    <rect x="-25" y="-25" width="25" height="50" class="yellow"/>
    <rect x="0" y="-25" width="25" height="50" class="black"/>
    <!-- Two cones pointing inward -->
    <polygon points="-15,20 -25,30 -15,10" class="cone"/>
    <polygon points="15,20 25,30 15,10" class="cone"/>
    <text x="0" y="90" class="text">WEST</text>
    <text x="0" y="105" class="text">Cones point together</text>
    <text x="0" y="120" class="text">Yellow over black</text>
  </g>
  
  <!-- Memory Aid -->
  <rect x="50" y="250" width="700" height="120" fill="#f0f0f0" stroke="#000" stroke-width="1"/>
  <text x="400" y="275" class="text title">Memory Aid</text>
  <text x="400" y="300" class="text">North: both cones point up, black band on top</text>
  <text x="400" y="320" class="text">East: cones point away — an "egg timer"</text>
  <text x="400" y="340" class="text">South: both cones point down, black band below</text>
  <text x="400" y="360" class="text">West: cones point together — a "wine glass"</text>
</svg>