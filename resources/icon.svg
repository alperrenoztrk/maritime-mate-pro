<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Mariner's Book master app icon. Keep the geometry broad and the number
       of details low: this artwork must remain legible at notification size. -->
  <defs>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e5f91"/>
      <stop offset="0.55" stop-color="#0b3768"/>
      <stop offset="1" stop-color="#061d3d"/>
    </linearGradient>
    <linearGradient id="page-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="page-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="icon-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#e7a62b"/>
    </linearGradient>
    <radialGradient id="top-light" cx="0.28" cy="0.12" r="0.86">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="book-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#icon-bg)"/>
  <rect width="1024" height="1024" fill="url(#top-light)"/>

  <!-- Quiet waterline: texture without adding a second symbol. -->
  <path d="M0 808 C142 754 268 862 410 808 C552 754 678 862 820 808 C894 780 960 794 1024 822 V1024 H0 Z" fill="#38bdf8" opacity="0.12"/>
  <path d="M0 872 C150 820 274 914 424 866 C574 818 698 912 848 864 C914 843 971 850 1024 874 V1024 H0 Z" fill="#e0f2fe" opacity="0.08"/>

  <!-- Open book: two broad pages and one clear central fold. -->
  <g filter="url(#book-shadow)">
    <path d="M174 292 C298 268 414 302 512 382 V782 C415 716 299 690 174 716 Z" fill="url(#page-left)"/>
    <path d="M850 292 C726 268 610 302 512 382 V782 C609 716 725 690 850 716 Z" fill="url(#page-right)"/>
    <path d="M512 382 V782" fill="none" stroke="#7dd3fc" stroke-width="18" stroke-linecap="round" opacity="0.72"/>
  </g>

  <!-- Compass medallion. Gold is reserved for the one actionable focal mark. -->
  <circle cx="512" cy="488" r="142" fill="#08264d" stroke="url(#icon-gold)" stroke-width="22"/>
  <circle cx="512" cy="488" r="108" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.22"/>
  <path d="M512 350 L568 492 L512 466 L456 492 Z" fill="#ffffff"/>
  <path d="M512 626 L456 484 L512 510 L568 484 Z" fill="url(#icon-gold)"/>
  <circle cx="512" cy="488" r="20" fill="#ffffff"/>
</svg>
