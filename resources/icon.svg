       yalnızca burayı güncellemek yeterli.

       Yapı sözleşmesi (scripts/generate-app-assets.mjs buna dayanır):
       - `#icon-bg`   : tam sayfa zemin, yalnız bu dikdörtgen.
       - `#icon-mark` : zeminden bağımsız, saydam üzerine basılabilen logo.
       Renk paleti aynı zamanda koyu/tinted varyantların yeniden renklendirme
       anahtarıdır: #FFFFFF zemin, #042E57 lacivert, #007885 turkuaz, #BF9131 altın. -->
