<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Mariner's Book uygulama ikonu kaynak dosyası.
       scripts/generate-app-assets.mjs bu dosyadan tüm Android/iOS
       ikon boyutlarını üretir. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3a7d"/>
      <stop offset="0.55" stop-color="#0b2a5b"/>
      <stop offset="1" stop-color="#071c3f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Hafif dalga dokusu -->
  <path d="M0 812 Q128 772 256 812 T512 812 T768 812 T1024 812 V1024 H0 Z"
        fill="#ffffff" opacity="0.05"/>
  <path d="M0 880 Q128 844 256 880 T512 880 T768 880 T1024 880 V1024 H0 Z"
        fill="#ffffff" opacity="0.07"/>

  <!-- Dümen simidi -->
  <g transform="translate(512 512)">
    <!-- Spoke kolları ve tutamaklar -->
    <g stroke="#f8fafc" stroke-width="34" stroke-linecap="round">
      <line x1="0" y1="-236" x2="0" y2="236" transform="rotate(0)"/>
      <line x1="0" y1="-236" x2="0" y2="236" transform="rotate(45)"/>
      <line x1="0" y1="-236" x2="0" y2="236" transform="rotate(90)"/>
      <line x1="0" y1="-236" x2="0" y2="236" transform="rotate(135)"/>
    </g>
    <!-- Tutamak topuzları -->
    <g fill="url(#gold)">
      <circle cx="0" cy="-330" r="42" transform="rotate(0)"/>
      <circle cx="0" cy="-330" r="42" transform="rotate(45)"/>
      <circle cx="0" cy="-330" r="42" transform="rotate(90)"/>
      <circle cx="0" cy="-330" r="42" transform="rotate(135)"/>
      <circle cx="0" cy="-330" r="42" transform="rotate(180)"/>
      <circle cx="0" cy="-330" r="42" transform="rotate(225)"/>
      <circle cx="0" cy="-330" r="42" transform="rotate(270)"/>
      <circle cx="0" cy="-330" r="42" transform="rotate(315)"/>
    </g>
    <!-- Topuz-çember bağlantıları -->
    <g stroke="#f8fafc" stroke-width="30">
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(0)"/>
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(45)"/>
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(90)"/>
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(135)"/>
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(180)"/>
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(225)"/>
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(270)"/>
      <line x1="0" y1="-236" x2="0" y2="-292" transform="rotate(315)"/>
    </g>
    <!-- Dış çember (jant) -->
    <circle r="236" fill="none" stroke="#f8fafc" stroke-width="52"/>
    <circle r="236" fill="none" stroke="#0b2a5b" stroke-width="6" opacity="0.35"/>
    <!-- Göbek -->
    <circle r="86" fill="#f8fafc"/>
    <circle r="52" fill="url(#gold)"/>
    <circle r="20" fill="#0b2a5b"/>
  </g>
</svg>
