  <body>
    <div id="splash-root" class="splash-root">
      <div class="splash-bg" aria-hidden="true"></div>
      <div class="splash-stage" aria-hidden="true">
        <div class="book">
          <div class="book-pages">
            <div class="book-page book-page-l"></div>
            <div class="book-page book-page-r"></div>
            <div class="book-crease"></div>
          </div>
          <div class="book-cover book-cover-l">
            <div class="book-cover-inner">
              <div class="book-emblem">
                <svg viewBox="0 0 64 64" width="42" height="42" fill="none" stroke="#daa520" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="32" cy="32" r="20"/>
                  <circle cx="32" cy="32" r="6"/>
                  <line x1="32" y1="4" x2="32" y2="16"/>
                  <line x1="32" y1="48" x2="32" y2="60"/>
                  <line x1="4" y1="32" x2="16" y2="32"/>
                  <line x1="48" y1="32" x2="60" y2="32"/>
                  <line x1="12" y1="12" x2="20" y2="20"/>
                  <line x1="44" y1="44" x2="52" y2="52"/>
                  <line x1="52" y1="12" x2="44" y2="20"/>
                  <line x1="20" y1="44" x2="12" y2="52"/>
                </svg>
              </div>
            </div>
          </div>
          <div class="book-cover book-cover-r">
            <div class="book-cover-inner"></div>
          </div>
        </div>
      </div>
      <div class="splash-title" translate="no" lang="en">MARINER'S BOOK</div>
      <div class="splash-tag" translate="no" lang="en">Interactive Maritime Learning</div>
      <style>
        .splash-root{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;transition:opacity .5s ease-out;}
        .splash-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #0a2a55 0%, #041530 55%, #020a14 100%);}
        .splash-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(218,165,32,0.08), transparent 60%);animation:splash-glow 2.2s ease-out forwards;}
        .splash-stage{position:relative;width:220px;height:170px;perspective:1400px;perspective-origin:50% 55%;margin-bottom:2rem;}
        .book{position:absolute;inset:0;transform-style:preserve-3d;animation:book-appear .55s cubic-bezier(.2,.8,.25,1) both;}
        .book-pages{position:absolute;top:8px;left:10px;right:10px;bottom:8px;background:linear-gradient(180deg,#f7ecd2 0%,#e9d9b0 100%);border-radius:3px;box-shadow:inset 0 0 24px rgba(120,80,20,.25),0 8px 24px rgba(0,0,0,.5);opacity:0;animation:pages-in .35s ease-out .55s both;}
        .book-page{position:absolute;top:6px;bottom:6px;width:47%;background:repeating-linear-gradient(180deg,transparent 0 6px,rgba(120,80,20,.08) 6px 7px);}
        .book-page-l{left:6px;border-right:1px solid rgba(120,80,20,.15);}
        .book-page-r{right:6px;border-left:1px solid rgba(120,80,20,.15);}
        .book-crease{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(80,50,10,.35),rgba(80,50,10,.6),rgba(80,50,10,.35));}
        .book-cover{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;backface-visibility:hidden;}
        .book-cover-inner{position:absolute;inset:0;background:linear-gradient(135deg,#0f3a7d 0%,#0a2a5a 50%,#071c3f 100%);border:1px solid rgba(218,165,32,.35);box-shadow:inset 0 0 20px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;}
        .book-cover-l{left:0;transform-origin:right center;border-radius:4px 2px 2px 4px;animation:cover-open-l 1s cubic-bezier(.55,.05,.25,1) .7s both;}
        .book-cover-r{right:0;transform-origin:left center;border-radius:2px 4px 4px 2px;animation:cover-open-r 1s cubic-bezier(.55,.05,.25,1) .7s both;}
        .book-cover-l .book-cover-inner{border-radius:4px 2px 2px 4px;}
        .book-cover-r .book-cover-inner{border-radius:2px 4px 4px 2px;}
        .book-emblem{opacity:.9;filter:drop-shadow(0 0 6px rgba(218,165,32,.5));}
        .splash-title{position:relative;color:#fff;font-weight:800;letter-spacing:8px;font-size:1.15rem;opacity:0;transform:translateY(10px);background:linear-gradient(135deg,#ffffff 0%,#f4d47a 50%,#ffffff 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:title-in .6s ease-out 1.35s forwards,title-shimmer 3s linear 1.95s infinite;}
        .splash-tag{position:relative;margin-top:.5rem;color:rgba(255,255,255,.55);font-weight:400;letter-spacing:3px;font-size:.7rem;text-transform:uppercase;opacity:0;animation:title-in .6s ease-out 1.55s forwards;}
        .splash-hide{opacity:0;pointer-events:none;}
        @keyframes book-appear{0%{opacity:0;transform:scale(.6) rotateX(20deg);}100%{opacity:1;transform:scale(1) rotateX(0);}}
        @keyframes pages-in{to{opacity:1;}}
        @keyframes cover-open-l{0%{transform:rotateY(0);}100%{transform:rotateY(-165deg);}}
        @keyframes cover-open-r{0%{transform:rotateY(0);}100%{transform:rotateY(165deg);}}
        @keyframes title-in{to{opacity:1;transform:translateY(0);}}
        @keyframes title-shimmer{to{background-position:200% center;}}
        @keyframes splash-glow{0%{opacity:0;}100%{opacity:1;}}
        @media (prefers-reduced-motion: reduce){
          .book,.book-pages,.book-cover-l,.book-cover-r,.splash-title,.splash-tag,.splash-bg::after{animation-duration:.3s !important;animation-delay:0s !important;}
        }
      </style>
    </div>

    <div id="root"></div>
