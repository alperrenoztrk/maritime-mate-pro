      <style>
        .splash-root{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;overflow:hidden;max-width:100vw;max-height:100vh;max-height:100svh;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;transition:opacity .16s cubic-bezier(.32,.72,0,1);padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-left)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-right));box-sizing:border-box;}
        .splash-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #0a2a55 0%, #041530 55%, #020a14 100%);}
        .splash-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(218,165,32,0.10), transparent 62%);opacity:0;animation:splash-glow 1.4s cubic-bezier(.4,0,.2,1) .5s forwards;}
        .splash-sea{position:absolute;left:0;right:0;bottom:0;height:47%;opacity:0;background:linear-gradient(180deg, rgba(9,38,74,0) 0%, rgba(18,64,118,.38) 30%, rgba(15,56,105,.55) 55%, rgba(5,22,46,.85) 100%);animation:sea-in .7s ease 2.5s forwards;}
        .splash-sea::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg, transparent, rgba(150,200,255,.4), transparent);}
        .splash-stage{position:relative;width:min(82vw,88svw,66svh*1.5,420px);max-width:100%;aspect-ratio:3/2;perspective:1600px;perspective-origin:50% 50%;margin-bottom:clamp(1rem,3.5svh,2rem);flex-shrink:0;opacity:0;transform:scale(.82);animation:stage-in .7s cubic-bezier(.22,1,.36,1) forwards;}

        /* Book: closed volume centered, cover swings open around the spine while the
           book slides right so the opened spread ends up centered. */
        .book{position:absolute;left:50%;top:0;bottom:0;width:50%;transform-style:preserve-3d;transform:translateX(-50%);animation:book-recenter 1.15s cubic-bezier(.72,.04,.22,1) .85s forwards,book-out .6s cubic-bezier(.55,0,.8,.4) 2.85s forwards;}
        .book-body{position:absolute;inset:0;background:linear-gradient(180deg,#f3e7c9 0%,#e6d3a8 100%);border-radius:3px 6px 6px 3px;box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 0 18px rgba(120,80,20,.18);}
        .book-body::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5%;background:linear-gradient(90deg,rgba(20,12,2,.5),rgba(20,12,2,.12) 70%,transparent);border-radius:3px 0 0 3px;}
        .book-body::after{content:"";position:absolute;right:0;top:1.5%;bottom:1.5%;width:3.2%;border-radius:0 4px 4px 0;background:repeating-linear-gradient(90deg,#f0e3c2 0 1.6px,#d5c194 1.6px 3.2px);}
        .page-right{position:absolute;left:2.5%;right:4.5%;top:3%;bottom:3%;border-radius:2px;background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(120,80,20,.07) 9px 10px),linear-gradient(180deg,#f8eed4 0%,#eddcb4 100%);}
        .page-right::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,rgba(90,60,20,.3),transparent);}
        .book-cover{position:absolute;left:0;top:0;bottom:0;right:3%;z-index:3;transform-style:preserve-3d;transform-origin:left center;transform:rotateY(0);animation:cover-open 1.15s cubic-bezier(.72,.04,.22,1) .85s forwards;will-change:transform;}
        .cover-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 7px 7px 3px;overflow:hidden;}
        .cover-front{background:linear-gradient(140deg,#12407f 0%,#0b2c5e 46%,#071e42 100%);border:1px solid rgba(218,165,32,.4);box-shadow:inset 0 0 26px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.5);transform:translateZ(.6px);}
        .cover-front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8%;background:linear-gradient(90deg,rgba(0,0,0,.5),transparent);border-right:1px solid rgba(218,165,32,.22);}
        .cover-back{background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(120,80,20,.06) 9px 10px),linear-gradient(180deg,#f6ebd0 0%,#e9d7ae 100%);transform:rotateY(180deg) translateZ(.6px);border-radius:7px 3px 3px 7px;box-shadow:inset 0 0 16px rgba(120,80,20,.22);}
        .cover-trim{position:absolute;inset:6.5%;container-type:inline-size;border:1.5px solid rgba(218,165,32,.55);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(3px,1vh,7px);padding:6% 4%;overflow:hidden;}
        .cover-trim::after{content:"";position:absolute;inset:2.5%;border:1px solid rgba(218,165,32,.28);border-radius:2px;}
        .cover-emblem{width:32%;aspect-ratio:1;filter:drop-shadow(0 0 6px rgba(218,165,32,.5));animation:emblem-glow 1.8s ease-in-out infinite alternate;}
        .cover-emblem svg{display:block;}
        .cover-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;text-align:center;white-space:nowrap;letter-spacing:.06em;line-height:1.3;font-size:clamp(.42rem,2.2vw,.72rem);color:#d9b258;background:linear-gradient(180deg,#f2d98a 0%,#caa044 60%,#f2d98a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
        @supports (font-size:1cqw){ .cover-title{font-size:9.2cqw;letter-spacing:.05em;} }
        .cover-rule{width:36%;height:1px;background:linear-gradient(90deg,transparent,rgba(218,165,32,.75),transparent);}
        .cover-sub{font-weight:500;letter-spacing:.18em;font-size:clamp(4.5px,1.55vw,8px);color:rgba(232,205,130,.72);text-transform:uppercase;text-align:center;}

        /* Ship: starts as line art over the right-hand page, pops into 3D, sails away. */
        .ship-stage{position:absolute;left:52.5%;top:18%;width:45%;height:60%;z-index:6;pointer-events:none;opacity:0;animation:ship-in .45s ease-out 2s forwards;}
        .ship-track{position:absolute;inset:0;animation:ship-sail 1.15s cubic-bezier(.5,.05,.85,.4) 3.05s forwards;will-change:transform;}
        .ship-lift{position:absolute;inset:0;transform-origin:50% 62%;animation:ship-pop .55s cubic-bezier(.34,1.45,.45,1) 2.6s forwards;will-change:transform;}
        .ship-bob{position:absolute;inset:0;transform-origin:50% 74%;animation:ship-bob 2.3s ease-in-out 2.6s infinite alternate;}
        .ship-flat{position:absolute;inset:0;width:100%;height:100%;opacity:.92;animation:flat-out .22s ease-out 2.6s forwards;}
        .ship-solid{position:absolute;inset:0;opacity:0;transform:perspective(900px) rotateY(-55deg) rotateX(9deg) scale(.94);animation:solid-in .55s cubic-bezier(.3,1.3,.5,1) 2.6s forwards;filter:drop-shadow(0 12px 16px rgba(2,10,22,.5));}
        .ship-solid svg{display:block;width:100%;height:100%;}
        .ship-wake{position:absolute;left:-4%;right:38%;bottom:16%;height:6%;border-radius:99px;opacity:0;background:linear-gradient(90deg,rgba(214,235,255,0),rgba(214,235,255,.5) 55%,rgba(255,255,255,.9));filter:blur(1px);transform-origin:right center;animation:wake-in .4s ease 3.15s forwards,wake-pulse 1s ease-in-out 3.15s infinite alternate;}
        .ship-wake::before{content:"";position:absolute;right:8%;top:-130%;width:55%;height:85%;border-radius:99px;background:linear-gradient(90deg,rgba(214,235,255,0),rgba(255,255,255,.65));}
        .ship-wake::after{content:"";position:absolute;right:4%;top:190%;width:70%;height:75%;border-radius:99px;background:linear-gradient(90deg,rgba(214,235,255,0),rgba(255,255,255,.5));}

        .splash-title{position:relative;color:#fff;font-weight:800;white-space:nowrap;letter-spacing:clamp(2px,.9vw,7px);font-size:clamp(.85rem,3.2vw,1.35rem);line-height:1.15;text-align:center;max-width:94vw;overflow:hidden;text-overflow:clip;opacity:0;transform:translateY(14px);background:linear-gradient(135deg,#ffffff 0%,#f4d47a 50%,#ffffff 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:title-in .75s cubic-bezier(.22,1,.36,1) 2.1s forwards,title-shimmer 3.2s linear 2.9s infinite;}
        .splash-tag{position:relative;margin-top:clamp(.35rem,1svh,.6rem);color:rgba(255,255,255,.55);font-weight:400;letter-spacing:clamp(1.5px,.6vw,3px);font-size:clamp(.6rem,2vw,.78rem);text-transform:uppercase;text-align:center;max-width:min(92vw,520px);opacity:0;transform:translateY(8px);animation:title-in .7s cubic-bezier(.22,1,.36,1) 2.3s forwards;}

        /* Tablet: larger stage, balanced title scale */
        @media (min-width:600px) and (max-width:1024px){
          .splash-stage{width:min(70vw,62svh*1.5,480px);}
          .splash-title{font-size:clamp(1.1rem,2.4vw,1.6rem);letter-spacing:clamp(4px,.8vw,9px);}
          .splash-tag{font-size:clamp(.68rem,1.2vw,.85rem);}
        }
        /* Short / landscape screens: keep book + title inside the viewport */
        @media (orientation:landscape) and (max-height:600px){
          .splash-stage{width:min(52svh*1.5,60vw,420px);margin-bottom:clamp(.5rem,2svh,1rem);}
          .splash-title{font-size:clamp(.85rem,2.2vh,1.25rem);letter-spacing:clamp(2px,.5vw,6px);}
        }

        .splash-hide{opacity:0;pointer-events:none;}
        @keyframes stage-in{to{opacity:1;transform:scale(1);}}
        @keyframes book-recenter{to{transform:translateX(0);}}
        @keyframes book-out{to{opacity:0;transform:translateX(0) translateY(10%) rotateX(30deg) scale(.93);}}
        @keyframes cover-open{to{transform:rotateY(-178deg);}}
        @keyframes ship-in{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
        @keyframes ship-pop{to{transform:scale(2.3) translate(-24%,-6%);}}
        @keyframes flat-out{to{opacity:0;}}
        @keyframes solid-in{to{opacity:1;transform:perspective(900px) rotateY(-14deg) rotateX(4deg) scale(1);}}
        @keyframes ship-sail{to{transform:translateX(92vw);}}
        @keyframes ship-bob{from{transform:rotate(-1.4deg) translateY(1.2%);}to{transform:rotate(1.8deg) translateY(-1.4%);}}
        @keyframes wake-in{to{opacity:.85;}}
        @keyframes wake-pulse{from{transform:scaleX(.82);}to{transform:scaleX(1.06);}}
        @keyframes sea-in{to{opacity:1;}}
        @keyframes title-in{to{opacity:1;transform:translateY(0);}}
        @keyframes title-shimmer{to{background-position:200% center;}}
        @keyframes splash-glow{to{opacity:1;}}
        @keyframes emblem-glow{from{filter:drop-shadow(0 0 4px rgba(218,165,32,.4));}to{filter:drop-shadow(0 0 10px rgba(218,165,32,.75));}}
        /* Returning launches (and reduced-motion) hide the splash after ~0.7s.
           The full choreography runs on delays out to 3.15s, so without this
           it would simply be cut off mid-book-opening. Both cases collapse to
           a short brand beat: the mark and title, no narrative. */
        @media (prefers-reduced-motion: reduce){
          .splash-stage,.book-cover,.ship-stage,.ship-flat,.ship-solid,.splash-title,.splash-tag,.splash-bg::after,.splash-sea{animation-duration:.3s !important;animation-delay:0s !important;}
          .book{animation:none !important;transform:translateX(0);}
          .ship-track,.ship-bob,.cover-emblem{animation:none !important;}
          .ship-lift{animation:none !important;transform:scale(1.7) translate(-20%,-8%);}
          .ship-wake{animation:none !important;opacity:.7;}
        }
        .splash-brief .splash-stage,.splash-brief .splash-tag,.splash-brief .splash-sea{display:none;}
        .splash-brief .splash-bg{background:#f2f2f7;}
        .splash-brief .splash-bg::after{display:none;}
        .splash-brief .splash-title{animation:none;opacity:1;transform:none;background:none;color:#111114;-webkit-text-fill-color:currentColor;font-size:1rem;letter-spacing:.14em;}
        @media (prefers-color-scheme:dark){
          .splash-brief .splash-bg{background:#0b0b0f;}
          .splash-brief .splash-title{color:#f5f5f7;}
        }

      </style>
    </div>

    <div id="root"></div>
    <!-- Splash bekçisi: uygulama paketi açılmazsa kullanıcıyı splash ekranında
         kilitli bırakmaz. Klasik script — modül paketini çökerten hatalardan
         etkilenmemesi ve üretim CSP'sine takılmaması için ayrı dosyada. -->
    <script src="/splash-watchdog.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
