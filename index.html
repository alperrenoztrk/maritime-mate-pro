         Android draws android/app/src/main/res/**/splash.png and iOS draws
         Assets.xcassets/Splash.imageset until the WebView paints; this block
         continues that exact picture — same ocean gradient, same white card,
         same logo geometry as renderSplash() in scripts/generate-app-assets.mjs
         — so the handoff is invisible instead of a colour flash.

         Two rules keep it that way:
          1. It must already be in its final form on the first painted frame.
             Nothing may restyle it afterwards; a class added once the bundle
             has booted lands as a visible flash halfway through launch.
          2. It is a colour bridge, not a story. The 120 ms budget in
             src/main.tsx (enforced by scripts/check-design-system.mjs) leaves

      <style>
        /* Geometry mirrors renderSplash(): the logo is 45% of the shorter
           screen dimension, the card pads it by 10% of the logo width and 16%
           of its height, and the corner radius and shadow are fractions of the
           card. Everything derives from one custom property so the two stay in
           step. Logo aspect ratio is 955/668 → 0.62 × 1.4296 = 0.8864. */
        .splash-root{--splash-logo-w:min(45vw,88.64vh);position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#0e5f91 0%,#061d3d 100%);transition:opacity .16s cubic-bezier(.32,.72,0,1);}
        @supports (height:100svh){.splash-root{--splash-logo-w:min(45vw,88.64svh);}}
        .splash-card{background:#fff;padding:calc(var(--splash-logo-w) * .1119) calc(var(--splash-logo-w) * .1);border-radius:calc(var(--splash-logo-w) * .1108);box-shadow:0 calc(var(--splash-logo-w) * .0369) calc(var(--splash-logo-w) * .0923) rgba(2,6,23,.35);}
        .splash-logo{display:block;width:var(--splash-logo-w);height:auto;}
        .splash-hide{opacity:0;pointer-events:none;}
        @media (prefers-reduced-motion:reduce){.splash-root{transition:none;}}
      </style>

    <div id="root"></div>
    <!-- Splash watchdog: it keeps a user from being stranded on the splash
         screen when the app bundle fails to open. A classic script in its own
         file, so an error that kills the module bundle cannot affect it and the
         production CSP does not block it. -->
    <script src="/splash-watchdog.js" defer></script>
