name: Curriculum teaching quality
on:
  pull_request:
    paths:
      - 'src/data/professionalCaseStudies.ts'
      - 'src/data/verifiedLessonVisuals.json'
      - 'src/data/verifiedLegacyVisuals.json'
      - 'src/utils/verifiedLegacyImage.ts'
      - 'src/pages/ShipSystemDeepDive.tsx'
      - 'src/pages/SafetyTopicsPage.tsx'
      - 'src/pages/SeamanshipTopicsPage.tsx'
      - 'src/pages/CargoTopicsPage.tsx'
      - 'src/components/PhotoGallery.tsx'
      - 'scripts/check-legacy-visual-provenance.mjs'
      - 'src/utils/lessonImageFallbacks.ts'
      - 'src/data/communicationTopicContents.ts'
      - 'src/data/shipSystemImages.ts'
      - 'src/data/shipSystems/longform/gmdss-lsa/4.ts'
      - 'src/assets/lessons/**'
      - 'src/assets/clouds/**'
      - 'src/assets/meteorology/**'
      - 'src/data/betaLessons.ts'
      - 'src/components/lessons/LessonTeachCard.tsx'
      - 'public/lessons/professional-*.svg'
      - 'docs/learning/content-audit.json'
      - 'scripts/audit-lesson-quality.mjs'
      - 'scripts/check-professional-cases.mjs'
      - '.github/workflows/curriculum-teaching-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check professional case integrity and reader linkage
        run: npm run check:professional-cases
      - name: Ensure only sourced, topic-specific images render
        run: npm run check:verified-lesson-visuals
      - name: Gate legacy lesson photographs by original source and exact topic
        run: npm run check:legacy-visuals
      - name: EPIRB topic accuracy and original photo
        run: npm run check:epirb-lesson
      - name: Verify complete learning inventory
        run: npm run check:learning-content
      - name: Audit all curriculum categories
        run: npm run audit:lesson-quality
      - name: TypeScript checking
        run: npm run typecheck
      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-test-key
          VITE_PRO_GATING_ENABLED: 'false'
          VITE_ADS_ENABLED: 'false'
        run: npm run build
