name: Android learning smoke
on:
  workflow_dispatch:
  push:
    branches: [codex/learning-depth-and-sync]
    paths: ['android/**', '.github/workflows/android-learning-smoke.yml']
  pull_request:
    paths: ['android/**', 'src/data/learningDepthReviews.json', '.github/workflows/android-learning-smoke.yml']
permissions:
  contents: read
concurrency:
  group: android-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packaged-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Build isolated native bundle
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-test-key
          VITE_PRO_GATING_ENABLED: 'false'
          VITE_ADS_ENABLED: 'false'
        run: npm run build:native && npm run check:native-build && npx cap sync android
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test packaged WebView offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Preserve device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-learning-smoke-api35
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/debug/
          if-no-files-found: warn
