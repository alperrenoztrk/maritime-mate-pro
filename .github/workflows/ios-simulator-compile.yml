name: iOS simulator compilation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/components/reader/**'
      - 'src/services/billing.ts'
      - 'src/services/playPurchaseSafety.ts'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-simulator-compile.yml'
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build native web assets
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-test-key
          VITE_PRO_GATING_ENABLED: 'false'
          VITE_ADS_ENABLED: 'false'
        run: npm run build:native && npm run check:native-build
      - name: Synchronize Capacitor and CocoaPods
        run: npx cap sync ios
      - name: Compile iOS Simulator app without Apple signing
        run: >
          xcodebuild -workspace ios/App/App.xcworkspace
          -scheme App -sdk iphonesimulator
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      # Simulator compilation proves native dependencies link; it does not
      # constitute physical iPhone usability or purchase acceptance.
