name: Android Release (AAB + APK)

# Google Play'e yüklenecek imzalı AAB'yi ve test için APK'yı üretir.
# İmzalama secret'ları (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64      -> keystore dosyasının base64 hali (base64 -w0 x.keystore)
#   ANDROID_KEYSTORE_PASSWORD    -> keystore parolası
#   ANDROID_KEY_ALIAS            -> anahtar alias'ı
#   ANDROID_KEY_ALIAS_PASSWORD   -> anahtar parolası
# Secret'lar tanımlı değilse build imzasız (unsigned) çıktı üretir.
#
# Reklamlar (varsayılan KAPALI). Reklam yolları `VITE_ADS_ENABLED` build-time
# anahtarına bağlıdır; repository variable olarak ADS_ENABLED tanımlı ve "true"
# değilse üretilen AAB'de hiç reklam olmaz (SDK başlatılmaz, onay formu
# açılmaz). Reklamı açmak için: Settings > Variables > ADS_ENABLED=true **ve**
# aşağıdaki dört birim kimliği secret'ı.
#
# AdMob secret'ları (yalnızca ADS_ENABLED=true iken etkilidir; anahtar açıkken
# tanımlı değillerse Google'ın TEST reklamları gösterilir — mağaza sürümünde
# gelir üretmez, mutlaka doldurun):
#   ADMOB_APP_ID_ANDROID           -> ca-app-pub-XXXX~YYYY (AndroidManifest)
#   ADMOB_BANNER_ID_ANDROID        -> ca-app-pub-XXXX/YYYY
#   ADMOB_INTERSTITIAL_ID_ANDROID
#   ADMOB_BANNER_ID_IOS / ADMOB_INTERSTITIAL_ID_IOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Capacitor 7 Android projesi Java 21 gerektirir
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # v3, Google'ın cmdline-tools indirme adresi değişikliğinden sonra
      # (Ekim 2026) "Setup Android SDK" adımında kırılıyordu; v4 düzeltmeyi içerir.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci || npm install

      # Mağaza derlemesi tek yönlüdür: Play'e yüklenen bir sürüm geri alınamaz,
      # yalnızca yenisi yayımlanabilir. Bu yüzden lint ve tip denetimi AAB
      # üretilmeden önce burada çalışır — daha önce yalnızca yerelde
      # çalıştıkları için ekrana görünmez karakter sızdıran bir hata sürüm
      # dalına kadar gelebilmişti.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run validation tests
        run: npm run test:validation

      - name: Guard native secure-storage loading
        run: npm run test:secure-storage

      - name: Guard native boot completion
        run: npm run test:native-boot

      - name: Run topic coverage quality gate
        run: npm run check:topic-coverage

      # Terim ve çeviri kapısı (CLAUDE.md "Commit öncesi kontroller"). Biri
      # başarısız olursa AAB hiç üretilmez; terim hatası içeren bir sürüm
      # Play'e gidemez. source-strings.json repoda tutulmuyor, kapsam
      # kontrolü için önce üretilir.
      - name: i18n — extract source strings
        run: npm run i18n:extract

      # Lovable düzenlemeleri ve özellik PR'ları yeni İngilizce arayüz metni
      # ekleyince sözlükte karşılık olmuyordu ve AAB hiç üretilmiyordu. Yeni
      # İngilizce metin bu derleme için tüm dillere İngilizce olarak yazılır
      # (ui-coverage.json kuralı; terim denetimleri yine çalışır). Türkçe metin
      # asla doldurulmaz: kontrol edilmiş İngilizce eklenene kadar derleme durur.
      # Doldurulan/eksik metinler run sayfasında uyarı olarak görünür.
      - name: i18n — fill new English UI strings for this build
        run: node --import tsx scripts/i18n/fill-english-coverage.mjs --ci

      # Hata olursa ilk hata satırları run sayfasına not olarak düşer;
      # log indirilmeden neyin kaldığı telefondan da görülür.
      - name: i18n — terms, coverage and language packs
        shell: bash
        run: |
          set -o pipefail
          npm run i18n:verify 2>&1 | tee "$RUNNER_TEMP/i18n-verify.log" || {
            grep -E "❌|✗|not ok|stale|below 100|Error:|new: [1-9]" "$RUNNER_TEMP/i18n-verify.log" \
              | head -n 25 | sed 's/%/%25/g; s/^/::error title=i18n gate::/'
            exit 1
          }

      - name: UI text and design checks
        shell: bash
        run: |
          set -o pipefail
          for check in check:svg-text check:ux-consistency check:design-system; do
            npm run "$check" 2>&1 | tee "$RUNNER_TEMP/$check.log" || {
              grep -v -E '^\s*$|^> ' "$RUNNER_TEMP/$check.log" | tail -n 15 \
                | sed "s/%/%25/g; s/^/::error title=$check::/"
              exit 1
            }
          done

      # Reklam anahtarı ve birimi kimlikleri JS bundle'ına build sırasında
      # gömülür (src/config/ads.ts). ADS_ENABLED variable'ı "true" değilse
      # (varsayılan) bundle'da reklam yolu hiç çalışmaz ve aşağıdaki kimlikler
      # ölü kalır — ileride reklam açılacağında yalnızca variable'ı çevirmek
      # yeterli olsun diye aktarım burada bırakıldı. Anahtar açık ama kimlik
      # secret'ları boşsa Google'ın resmi TEST reklamlarına düşülür — yani
      # secret eklenmeden üretilen AAB gerçek reklam göstermez, gelir üretmez.
      #
      # ÖNEMLİ: Burada `npm run build` DEĞİL, `npm run build:native` kullanılır.
      # vite.config.ts içinde PWA service worker ve @vitejs/plugin-legacy
      # yalnızca `mode !== "native"` iken devreye girer. Web build'i Capacitor
      # WebView'ine paketlenirse gereksiz service worker ve ES5/nomodule ağacı
      # da paketlenir; bu, uygulamanın açılışta beyaz ekranda kalmasına yol
      # açabilir.
      - name: Build web (Vite, native profile)
        env:
          # Pro kilitleri (varsayılan KAPALI, bkz. src/config/proGating.ts).
          # Kapalı test boyunca kapalı kalır; üretime gidecek AAB'den önce
          # Settings > Variables > PRO_GATING_ENABLED=true yapılır.
          VITE_PRO_GATING_ENABLED: ${{ vars.PRO_GATING_ENABLED }}
          VITE_ADS_ENABLED: ${{ vars.ADS_ENABLED }}
          VITE_ADMOB_BANNER_ID_ANDROID: ${{ secrets.ADMOB_BANNER_ID_ANDROID }}
          VITE_ADMOB_INTERSTITIAL_ID_ANDROID: ${{ secrets.ADMOB_INTERSTITIAL_ID_ANDROID }}
          VITE_ADMOB_BANNER_ID_IOS: ${{ secrets.ADMOB_BANNER_ID_IOS }}
          VITE_ADMOB_INTERSTITIAL_ID_IOS: ${{ secrets.ADMOB_INTERSTITIAL_ID_IOS }}
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_ENV"
          else
            echo "İmzalama secret'ları yok — unsigned build üretilecek."
          fi

      # app/build.gradle, KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS /
      # KEY_PASSWORD ortam değişkenleri tanımlıysa release'i otomatik imzalar.
      # ADMOB_APP_ID_ANDROID manifest'e enjekte edilir; tanımlı değilse
      # Google'ın TEST App ID'si kullanılır (derleme asla kırılmaz). AdMob SDK
      # pakette bağımlılık olduğu için bu meta-data reklamlar kapalıyken de
      # gereklidir — eksik olursa uygulama açılışta çöker.
      - name: Build AAB (Play Store) + APK (test)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: marine-expert-pro-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: marine-expert-pro-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
