name: Android Release (AAB + APK)

# Google Play'e yüklenecek imzalı AAB'yi ve test için APK'yı üretir.
# İmzalama secret'ları (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64      -> keystore dosyasının base64 hali (base64 -w0 x.keystore)
#   ANDROID_KEYSTORE_PASSWORD    -> keystore parolası
#   ANDROID_KEY_ALIAS            -> anahtar alias'ı
#   ANDROID_KEY_ALIAS_PASSWORD   -> anahtar parolası
# Secret'lar tanımlı değilse build imzasız (unsigned) çıktı üretir.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor 7 Android projesi Java 21 gerektirir
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run validation tests
        run: npm run test:validation

      - name: Run topic coverage quality gate
        run: npm run check:topic-coverage

      - name: Build web (Vite)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_ENV"
          else
            echo "İmzalama secret'ları yok — unsigned build üretilecek."
          fi

      # app/build.gradle, KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS /
      # KEY_PASSWORD ortam değişkenleri tanımlıysa release'i otomatik imzalar.
      - name: Build AAB (Play Store) + APK (test)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: marine-expert-pro-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marine-expert-pro-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
