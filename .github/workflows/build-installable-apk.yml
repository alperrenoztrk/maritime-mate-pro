name: Build installable Android APK

on:
  push:
    branches:
      - agent/build-installable-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Escape Android application name
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/res/values/strings.xml')
          content = path.read_text(encoding='utf-8')
          content = content.replace("Mariner's Book", r"Mariner\'s Book")
          path.write_text(content, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mariners-book-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
