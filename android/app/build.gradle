apply plugin: 'com.android.application'

// Release imzalama bilgileri repo dışında tutulur:
// 1) android/keystore.properties dosyası (gitignored), veya
// 2) CI ortam değişkenleri (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def resolveSigning = { String propKey, String envKey ->
    keystoreProperties.getProperty(propKey) ?: System.getenv(envKey)
}
def signingStoreFile = resolveSigning("storeFile", "KEYSTORE_FILE")
def signingStorePassword = resolveSigning("storePassword", "KEYSTORE_PASSWORD")
def signingKeyAlias = resolveSigning("keyAlias", "KEY_ALIAS")
def signingKeyPassword = resolveSigning("keyPassword", "KEY_PASSWORD")
def hasReleaseSigning = signingStoreFile != null && signingStorePassword != null &&
        signingKeyAlias != null && signingKeyPassword != null

// AdMob uygulama kimliği (manifest'e ${admobAppId} olarak enjekte edilir).
// Kaynak sırası: android/admob.properties (gitignored) → ADMOB_APP_ID_ANDROID
// ortam değişkeni → Google'ın resmi TEST App ID'si.
// Varsayılan her zaman dolu olduğu için derleme asla kimlik eksikliğinden kırılmaz;
// eksik/boş bırakılan gerçek kimlik yerine test reklamı gösterilir.
def admobPropertiesFile = rootProject.file("admob.properties")
def admobProperties = new Properties()
if (admobPropertiesFile.exists()) {
    admobProperties.load(new FileInputStream(admobPropertiesFile))
}
def resolvedAdmobAppId = admobProperties.getProperty("appId") ?:
        System.getenv("ADMOB_APP_ID_ANDROID") ?:
        "ca-app-pub-3940256099942544~3347511713"

android {
    namespace "com.marinersbook.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.marinersbook.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // package.json "version" ile birlikte artırın (2.5.74 -> 20574).
        // src/lib/appVersion.ts içindeki BUILD_NUMBER ile eşleşmeli.
        versionCode 20574
        versionName "2.5.74"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [admobAppId: resolvedAdmobAppId]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    bundle {
        language {
            // Uygulama içi dil değiştirme kullanıldığı için tüm dilleri AAB'de tut
            enableSplit = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Google Play Billing: Pro abonelik ve ömür boyu satın alma (PlayBillingPlugin).
    implementation "com.android.billingclient:billing:7.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase/Google Services kasıtlı olarak yok: uygulama kimlik doğrulama,
// veritabanı ve depolama için Supabase kullanıyor, push bildirimi göndermiyor.
// google-services.json ve com.google.gms eklentisi, hiçbir Firebase SDK'sı
// kurulu olmadığı hâlde derlemeye giriyordu (ve API anahtarını repoya
// taşıyordu); ikisi de kaldırıldı. Firebase ileride gerçekten kullanılırsa
// eklenti classpath'i android/build.gradle'a geri eklenmelidir.
